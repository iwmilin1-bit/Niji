        async function uploadPostImage(file) {
            if (!file) return null;
            // Сразу возвращаем NO_STORAGE — base64 обрабатывается в createPost
            return 'NO_STORAGE';
        }

        async function createPost(inputId) {
            if (!currentUser) return toast('Войдите!', true);
            const input = document.getElementById(inputId);
            if (!input) return;

            const text = input.value.trim();
            const previewImg = document.getElementById(inputId + '-preview-img');
            const previewBox = document.getElementById(inputId + '-preview');
            const photoSrc = (previewImg && previewBox && previewBox.style.display !== 'none') ? previewImg.src : null;

            if (!text && !photoSrc) return toast('Напиши текст или прикрепи фото!', true);

            let imageUrl = null;

            if (photoSrc) {
                toast('Загружаю фото...');
                try {
                    let uploaded = null;

                    if (photoSrc.startsWith('data:')) {
                        // Фото с устройства (base64) — сжимаем и грузим
                        const compressed = await compressImage(photoSrc, 1200, 0.85);
                        const res = await fetch(compressed);
                        const blob = await res.blob();
                        const file = new File([blob], `photo_${Date.now()}.jpg`, { type: 'image/jpeg' });
                        uploaded = await uploadPostImage(file);
                    } else {
                        // Фото из галереи (внешний URL) — качаем через fetch
                        try {
                            const res = await fetch(photoSrc, { mode: 'cors' });
                            const blob = await res.blob();
                            const file = new File([blob], `photo_${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
                            uploaded = await uploadPostImage(file);
                        } catch(corsErr) {
                            // CORS заблокировал — сохраняем URL напрямую
                            console.warn('CORS блок, используем URL напрямую:', corsErr.message);
                            imageUrl = photoSrc;
                        }
                    }

                    if (uploaded && uploaded !== 'NO_STORAGE') {
                        imageUrl = uploaded;
                    } else if (uploaded === 'NO_STORAGE') {
                        // Storage не настроен — сохраняем сжатый base64
                        if (photoSrc.startsWith('data:')) {
                            // Агрессивное сжатие чтобы влезло в лимит Supabase
                            let compressed = await compressImage(photoSrc, 600, 0.65);
                            if (compressed.length > 800000) compressed = await compressImage(photoSrc, 400, 0.5);
                            if (compressed.length > 800000) compressed = await compressImage(photoSrc, 300, 0.4);
                            imageUrl = compressed;
                        } else {
                            imageUrl = photoSrc;
                        }
                        // Показываем инструкцию как исправить
                        showStorageFixModal();
                    } else if (!imageUrl) {
                        return;
                    }
                } catch(e) {
                    console.error('Ошибка фото:', e);
                    toast('❌ Ошибка при обработке фото: ' + e.message, true);
                    return;
                }
            }

            const tagMatch = text.match(/#(\S+)/);
            // Выбранная рамка для фото
            const selectedPhotoFrame = document.getElementById(inputId + '-frame-select')?.value || null;

            // Перед публикацией берём свежий level из базы
            const { data: freshUser } = await SB.from('users').select('level, reputation').eq('login', currentUser.login).single();
            if (freshUser) { currentUser.level = freshUser.level; currentUser.reputation = freshUser.reputation; }

            const { error } = await SB.from('posts').insert([{
                user_login: currentUser.login,
                username: currentUser.username,
                content: text || '',
                tag: tagMatch ? tagMatch[1] : '',
                image_url: imageUrl,
                level: currentUser.level || 1,
                avatar_url: currentUser.avatar_url || null,
                photo_frame: imageUrl ? (selectedPhotoFrame || null) : null
            }]);

            if (error) {
                // Если ошибка из-за большого фото — пробуем с ещё сильнее сжатым
                if (imageUrl && imageUrl.startsWith('data:') && (error.message.includes('too large') || error.message.includes('payload') || error.code === '54000' || error.message.includes('request'))) {
                    const tinyUrl = await compressImage(imageUrl, 250, 0.35);
                    const { error: e3 } = await SB.from('posts').insert([{
                        user_login: currentUser.login,
                        username: currentUser.username,
                        content: text || '',
                        tag: tagMatch ? tagMatch[1] : '',
                        image_url: tinyUrl,
                        level: currentUser.level || 1,
                        avatar_url: currentUser.avatar_url || null,
                        photo_frame: selectedPhotoFrame || null
                    }]);
                    if (!e3) { toast('✅ Опубликовано с фото!'); }
                    else {
                        // Совсем не влезло — публикуем без фото
                        const { error: e2 } = await SB.from('posts').insert([{
                            user_login: currentUser.login,
                            username: currentUser.username,
                            content: text || '',

        // Сжатие изображения через canvas
        function compressImage(src, maxSize, quality) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                if (!src.startsWith('data:')) img.crossOrigin = 'anonymous';
                img.onload = () => {
                    let w = img.width, h = img.height;
                    if (w > maxSize || h > maxSize) {
                        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
                        else { w = Math.round(w * maxSize / h); h = maxSize; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = src;
            });
        }

        async function addReputation(userLogin, amount, reason = '') {
            if (!userLogin || amount === 0) return;

            if (currentUser && currentUser.login === userLogin) {
                await SB.from('users').update({ last_seen: new Date().toISOString() }).eq('login', userLogin);

            const { data: user } = await SB.from('users')
                .select('reputation, level')
                .eq('login', userLogin)
                .single();

            if (!user) return;

            const newReputation = (user.reputation || 0) + amount;
            const newLevel = Math.floor(newReputation / 100) + 1;
            const leveledUp = newLevel > (user.level || 1);

            await SB.from('users').update({
                reputation: newReputation,
                level: newLevel
            }).eq('login', userLogin);

            // Показываем красивое уведомление

                let msg = `+${amount} репутации`;
                if (reason) msg += ` (${reason})`;
                if (leveledUp) msg += `  → LVL ${newLevel}!`;

                toast(msg);
            }
        }

            const oldPass = document.getElementById('settingsOldPass')?.value;

            const confPass = document.getElementById('settingsConfPass')?.value;
            if (!oldPass || !newPass || !confPass) return toast('Заполни все поля!', true);
            if (newPass.length < 3) return toast('Новый пароль слишком короткий!', true);
            if (newPass !== confPass) return toast('Пароли не совпадают!', true);
            // Проверяем старый пароль
            const { data: user } = await SB.from('users').select('password').eq('login', currentUser.login).single();
            if (!user || user.password !== oldPass) return toast('Неверный старый пароль!', true);
            const { error } = await SB.from('users').update({ password: newPass }).eq('login', currentUser.login);
            if (error) return toast('Ошибка: ' + error.message, true);
            document.getElementById('settingsOldPass').value = '';
            document.getElementById('settingsNewPass').value = '';
            document.getElementById('settingsConfPass').value = '';
            toast('✅ Пароль изменён!');

        async function loadRecentUsers() {
            const el = document.getElementById('devRecentUsers');
            if (!el) return;
            const { data } = await SB.from('users').select('username, login, level, created_at').order('created_at', { ascending: false }).limit(5);
            if (!data || !data.length) { el.textContent = 'Нет данных'; return; }
            el.innerHTML = data.map(u => `
                <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
                    <span style="cursor:pointer;color:var(--blue);" onclick="document.getElementById('devFrameModal').remove();goProfile('${u.login}')">${u.username}</span>
                    <span style="color:#f9ca24;font-size:11px;">LVL ${u.level||1}</span>
                </div>`).join('');
        }

        function switchDevTab(tab) {
            const tabColors = { boost:'#f9ca24', stats:'#2ed573', tools:'#a29bfe', reset:'#ff4757', medals:'#4dc9f6', medal:'var(--pink)', frame:'var(--pink)' };
            const darkText  = new Set(['boost','stats']);
            ['frame','medal','medals','boost','stats','tools','reset'].forEach(t => {
                const el = document.getElementById('devTab_'+t);
                const btn = document.getElementById('devTab_'+t+'_btn');
                if (!el || !btn) return;
                const active = t === tab;
                el.style.display = active ? '' : 'none';
                if (active) {
                    btn.style.background = tabColors[t] || 'var(--pink)';
                    btn.style.color = darkText.has(t) ? '#000' : '#fff';
                    btn.style.border = 'none';
                } else {
                    btn.style.background = 'var(--surface2)';
                    btn.style.color = 'var(--text2)';
                    btn.style.border = '1px solid var(--border)';
                }
            });
            if (tab === 'stats') loadRecentUsers();
        }

        async function devSetLevel(targetLogin) {
            if (!currentUser || !DEVS.includes(currentUser.login.toLowerCase())) return;
            const lvl = parseInt(document.getElementById('devBoostLvl')?.value) || 1;
            if (lvl < 1 || lvl > 99) { toast('Уровень от 1 до 99', true); return; }
            const { error } = await SB.from('users').update({ level: lvl }).eq('login', targetLogin);
            if (error) { toast('Ошибка: ' + error.message, true); return; }
            await SB.from('notifications').insert([{ user_login: targetLogin, type: 'like', text: `⚡ DEV установил тебе LVL ${lvl}! Крути! 🎉`, from_login: currentUser.login, is_read: false }]);
            toast(`⚡ LVL ${lvl} выдан!`);
            document.getElementById('devFrameModal')?.remove();
            await renderProfile();
        }

        async function devSetRep(targetLogin) {
            if (!currentUser || !DEVS.includes(currentUser.login.toLowerCase())) return;
            const rep = parseInt(document.getElementById('devBoostRep')?.value) || 0;
            const { error } = await SB.from('users').update({ reputation: rep }).eq('login', targetLogin);
            if (error) { toast('Ошибка: ' + error.message, true); return; }
            toast(`💖 Репутация ${rep} выдана!`);
            document.getElementById('devFrameModal')?.remove();
            await renderProfile();
        }

        async function devSendNotif(targetLogin) {
            if (!currentUser || !DEVS.includes(currentUser.login.toLowerCase())) return;
            const text = document.getElementById('devNotifText')?.value?.trim();
            if (!text) { toast('Введи текст', true); return; }
            await SB.from('notifications').insert([{ user_login: targetLogin, type: 'like', text: `📨 Сообщение от DEV: ${text}`, from_login: currentUser.login, is_read: false }]);
            toast('✅ Сообщение отправлено!');
            document.getElementById('devNotifText').value = '';
        }

        async function devSendAnnounce() {
            if (!currentUser || !DEVS.includes(currentUser.login.toLowerCase())) return;
            const text = document.getElementById('devAnnounceText')?.value?.trim();
            if (!text) { toast('Введи текст объявления', true); return; }
            const { data: users } = await SB.from('users').select('login');
            if (!users || !users.length) { toast('Нет пользователей', true); return; }
            const notifs = users.map(u => ({ user_login: u.login, type: 'like', text: `📣 Объявление Niji: ${text}`, from_login: currentUser.login, is_read: false }));
            // Вставляем батчами по 50
            for (let i = 0; i < notifs.length; i += 50) {
                await SB.from('notifications').insert(notifs.slice(i, i + 50));
            }
            toast(`📣 Отправлено ${users.length} пользователям!`);
            document.getElementById('devAnnounceText').value = '';
        }

        async function devSetVerify(targetLogin, val) {
            if (!currentUser || !DEVS.includes(currentUser.login.toLowerCase())) return;
            const { error } = await SB.from('users').update({ is_verified: val }).eq('login', targetLogin);
            if (error) { toast('Ошибка: ' + error.message, true); return; }
            if (val) await SB.from('notifications').insert([{ user_login: targetLogin, type: 'like', text: `💎 Тебе выдана верификация! Теперь у тебя есть значок 💎`, from_login: currentUser.login, is_read: false }]);
            toast(val ? '💎 Верификация выдана!' : 'Верификация снята');
            document.getElementById('devFrameModal')?.remove();
            await renderProfile();
        }

        async function devUnban(targetLogin) {
            if (!currentUser || !DEVS.includes(currentUser.login.toLowerCase())) return;
            const { error } = await SB.from('users').update({ is_banned: false, ban_reason: null }).eq('login', targetLogin);
            if (error) { toast('Ошибка', true); return; }
            toast('✅ Пользователь разбанен');
            document.getElementById('devFrameModal')?.remove();
            await renderProfile();
        }

        async function devClearPosts(targetLogin, targetUsername) {
            if (!currentUser || !DEVS.includes(currentUser.login.toLowerCase())) return;
            if (!confirm(`Удалить ВСЕ посты ${targetUsername}? Это необратимо!`)) return;
            const { error } = await SB.from('posts').delete().eq('user_login', targetLogin);
            if (error) { toast('Ошибка: ' + error.message, true); return; }
            toast(`🗑️ Все посты ${targetUsername} удалены`);
            document.getElementById('devFrameModal')?.remove();
            await renderFeed();
        }

        function devCopyInfo(login, username, level, rep) {
            const text = `Логин: ${login}\nИмя: ${username}\nLVL: ${level}\nРепутация: ${rep}`;
            navigator.clipboard?.writeText(text).then(() => toast('📋 Скопировано!')).catch(() => toast('Не удалось скопировать', true));

        function buildPhotoFrame(imageUrl, frameId) {
            if (!frameId || frameId === 'none') {
                return `<img src="${imageUrl}" class="post-image" alt="post image" onerror="this.style.display='none'">`;
            }
            const f = PHOTO_FRAMES.find(x => x.id === frameId);
            if (!f) return `<img src="${imageUrl}" class="post-image" alt="post image" onerror="this.style.display='none'">`;
            const charL = CHAR_SVG[`${frameId}_L`] || '';
            const charR = CHAR_SVG[`${frameId}_R`] || '';
            return `
            <div class="photo-frame-wrap ${f.css}">
                <div class="photo-frame-overlay">
                    <div class="pf-corner pf-corner-tl"></div>
                    <div class="pf-corner pf-corner-tr"></div>
                    <div class="pf-corner pf-corner-bl"></div>
                    <div class="pf-corner pf-corner-br"></div>
                </div>
                <img src="${imageUrl}" class="post-image" style="position:relative;z-index:1;margin:0;border-radius:0;" alt="post image" onerror="this.parentElement.style.display='none'">
                <div class="pf-char-left">${charL}</div>
                <div class="pf-char-right">${charR}</div>
            </div>`;
        }

        async function devGiveFrame(targetLogin, frameId) {
            if (!currentUser || !DEVS.includes(currentUser.login.toLowerCase())) return;
            const { error } = await SB.from('users').update({ avatar_frame: frameId || null }).eq('login', targetLogin);
            if (error) { toast('Ошибка! Добавь колонку avatar_frame в Supabase SQL Editor', true); return; }
            document.getElementById('devFrameModal')?.remove();
            // Уведомление пользователю
            if (frameId) {
                const f = getFrameDef(frameId);
                await SB.from('notifications').insert([{
                    user_login: targetLogin, type: 'like',
                    text: `👑 DEV выдал тебе рамку "${f.label}"! Загляни в профиль ✨`,
                    from_login: currentUser.login, is_read: false
                }]);
            }
            toast(frameId ? `Рамка выдана пользователю!` : 'Рамка снята');
            await renderProfile();
        }

        async function devGiveMedal(targetLogin, medalId) {
            if (!currentUser || !DEVS.includes(currentUser.login.toLowerCase())) return;
            const { error } = await SB.from('users').update({ dev_medal: medalId || null }).eq('login', targetLogin);
            if (error) { toast('Ошибка! Выполни SQL: alter table users add column if not exists dev_medal text;', true); return; }
            document.getElementById('devFrameModal')?.remove();
            if (medalId) {
                const m = DEV_MEDALS.find(x => x.id === medalId);
                await SB.from('notifications').insert([{
                    user_login: targetLogin, type: 'like',
                    text: `🏅 DEV выдал тебе эксклюзивную медаль "${m?.label || medalId}"! Загляни в профиль ✨`,
                    from_login: currentUser.login, is_read: false
                }]);
            }
            toast(medalId ? `Медаль выдана!` : 'Медаль снята');
            await renderProfile();
        }

        async function devResetLevel(targetLogin) {

        async function saveAvatar() {
            if (!currentUser) return;

            let avatarUrl = null;

            if (avatarGalleryTab === 'upload' && uploadedAvatarFile) {
                toast('Загружаю аватар...');
                try {
                    // Сжимаем до 300px
                    const previewImg = document.getElementById('uploadAvatarPreviewImg');
                    if (!previewImg || !previewImg.src.startsWith('data:')) return toast('Сначала выбери фото!', true);
                    const compressed = await compressImage(previewImg.src, 300, 0.85);
                    const res = await fetch(compressed);
                    const blob = await res.blob();
                    const safeLogin = currentUser.login.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_.-]/g,'');
                    const fileName = `avatars/${safeLogin}_${Date.now()}.jpg`;
                    const { error: upErr } = await SB.storage.from('post-images').upload(fileName, blob, { contentType:'image/jpeg', upsert: true });
                    if (upErr) {
                        // Storage не доступен — сохраняем base64
                        avatarUrl = compressed;
                    } else {
                        const { data: urlData } = SB.storage.from('post-images').getPublicUrl(fileName);
                        avatarUrl = urlData.publicUrl;
                    }
                } catch(e) {
                    return toast('Ошибка загрузки фото', true);
                }
            } else if (selectedAvatarEmoji || selectedAvatarGradient) {
                const emoji = selectedAvatarEmoji || currentUser.username[0].toUpperCase();
                const bg = selectedAvatarGradient || color(currentUser.login);
                avatarUrl = `data:avatar/svg+xml,${encodeURIComponent(JSON.stringify({ emoji, bg }))}`;
            } else {
                return toast('Выберите аватар!', true);
            }

            // Сохраняем в БД — чтобы ВСЕ видели
            const { error: dbErr } = await SB.from('users').update({ avatar_url: avatarUrl }).eq('login', currentUser.login);
            if (dbErr) {
                toast('⚠️ Ошибка БД: ' + dbErr.message, true);
                return;
            }

            // И в localStorage как кэш
            const avatarMap = JSON.parse(localStorage.getItem('niji_avatars') || '{}');
            avatarMap[currentUser.login] = avatarUrl;
            localStorage.setItem('niji_avatars', JSON.stringify(avatarMap));

            currentUser.avatar_url = avatarUrl;
            toast('✅ Аватар сохранён!');
            document.getElementById('avatarGalleryModal')?.remove();
            uploadedAvatarFile = null;
            renderAll();
            await renderProfile();
        }

        function buildAvatarInner(user, size, fontSize, border) {
            const av = user.avatar_url;
            let style = `width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;`;
            if (border) style += 'border:2px solid var(--border);';
            if (!av) {
                return `<div style="${style}background:${color(user.login)};color:#fff;font-weight:700;font-size:${fontSize}px;">${user.username[0].toUpperCase()}</div>`;
            }
            if (av.startsWith('data:avatar/svg+xml,')) {
                try {
                    const parsed = JSON.parse(decodeURIComponent(av.replace('data:avatar/svg+xml,', '')));
                    return `<div style="${style}background:${parsed.bg};color:#fff;font-size:${Math.round(size*0.55)}px;">${parsed.emoji}</div>`;
                } catch { /* fallback */ }
            }
            return `<div style="${style}background:${color(user.login)};"><img src="${esc(av)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.parentElement.innerHTML='<span style=\'color:#fff;font-weight:700;font-size:${fontSize}px;\'>${user.username[0].toUpperCase()}</span>'"></div>`;
        }

        function buildAvatarHtml(user, size = 34, fontSize = 14, border = false) {
            const frameId = user.avatar_frame;
            const frameDef = frameId ? getFrameDef(frameId) : null;
            const inner = buildAvatarInner(user, size, fontSize, border && !frameDef);
            if (!frameDef) return inner;
            const pad = Math.max(3, Math.round(size * 0.1));
            const total = size + pad * 2;
            return `<div class="avatar-frame-wrap" style="width:${total}px;height:${total}px;flex-shrink:0;"><div class="av-frame ${frameDef.css}" style="inset:-${pad}px;"></div><div style="position:relative;z-index:1;">${inner}</div></div>`;
        }

        // === Система уведомлений ===
        const NOTIF_ICONS = {
            'like': '❤️', 'comment': '💬', 'follow': '👤',
            'new_post': '📝', 'message': '✉️',
            'verification_request': '💎', 'verification_approved': '✅', 'verification_rejected': '❌', 'ban': '🔨', 'unban': '✅'
        };

        async function loadNotifications() {
            if (!currentUser) return;
            const { data: notifs } = await SB.from('notifications')
                .select('*')
                .eq('user_login', currentUser.login)
                .order('created_at', { ascending: false })
                .limit(50);

            const unread = (notifs || []).filter(n => !n.is_read).length;
            const badge = document.getElementById('notifBadge');
            if (badge) {
                badge.textContent = unread > 9 ? '9+' : unread;
                badge.style.display = unread > 0 ? 'flex' : 'none';
            }

            const list = document.getElementById('notifList');
            if (!list) return;
            if (!notifs || notifs.length === 0) {
                list.innerHTML = '<div style="padding:30px 20px; text-align:center; color:var(--text2); font-size:13px;">🔔 Нет уведомлений</div>';
                return;
            }

            // Загружаем данные отправителей (from_login)
            const actorLogins = [...new Set((notifs || []).map(n => n.from_login).filter(Boolean))];
            let actorMap = {};
            if (actorLogins.length > 0) {
                const { data: actors } = await SB.from('users').select('login, username, avatar_url, level').in('login', actorLogins);
                const avatarCache = JSON.parse(localStorage.getItem('niji_avatars') || '{}');
                (actors || []).forEach(u => {
                    if (!u.avatar_url && avatarCache[u.login]) u.avatar_url = avatarCache[u.login];
                    actorMap[u.login] = u;
                });
            }

            list.innerHTML = notifs.map(n => {
                const t = new Date(n.created_at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                const icon = NOTIF_ICONS[n.type] || '🔔';
                const postMatch = n.text.match(/\[post_id:(\d+)\]/);
                const postId = postMatch ? postMatch[1] : null;
                const displayText = n.text.replace(/\s*\[post_id:\d+\]/, '');
                const clickAction = postId
                    ? `markNotifRead('${n.id}', this); goToPost('${postId}')`
                    : n.from_login ? `markNotifRead('${n.id}', this); goProfile('${n.from_login}')` : `markNotifRead('${n.id}', this)`;

                // Аватарка отправителя
                const actor = n.from_login ? actorMap[n.from_login] : null;
                let avatarHtml = '';
                if (actor) {
                    avatarHtml = buildAvatarHtml(actor, 36, 14);
                } else {
                    avatarHtml = `<div style="width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">${icon}</div>`;
                }

                const avatarClickAction = actor ? `event.stopPropagation(); markNotifRead('${n.id}', this.closest('.notif-item')); goProfile('${n.from_login}')` : '';
                return `<div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="${clickAction}" style="gap:10px;">
                    <div style="flex-shrink:0;${actor ? 'cursor:pointer;' : ''}" onclick="${avatarClickAction}" title="${actor ? 'Профиль ' + esc(actor.username) : ''}">${avatarHtml}</div>
                    <div class="notif-body">
                        ${actor ? `<div style="font-weight:600;font-size:12px;color:var(--text);margin-bottom:2px;cursor:pointer;" onclick="event.stopPropagation(); markNotifRead('${n.id}', this.closest('.notif-item')); goProfile('${n.from_login}')" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--text)'">${esc(actor.username)} <span style="font-size:10px;background:linear-gradient(90deg,#ff6b9d,#4dc9f6);color:#fff;padding:1px 5px;border-radius:6px;">LVL ${actor.level||1}</span></div>` : ''}
                        <div style="word-break:break-word;font-size:12px;">${esc(displayText)}</div>
                        ${postId ? `<div style="font-size:10px;color:var(--blue);margin-top:2px;">📌 Перейти к посту</div>` : ''}
                        <div class="notif-time">${t}</div>
                    </div>
                    ${!n.is_read ? '<div class="notif-dot"></div>' : ''}
                </div>`;
            }).join('');
        }

        function showNotifToast(text) {
            let el = document.getElementById('notifPopup');
            if (!el) {
                el = document.createElement('div');
                el.id = 'notifPopup';
                el.style.cssText = 'position:fixed;top:60px;right:16px;background:var(--surface);border:1px solid var(--pink);border-radius:14px;padding:12px 16px;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s;transform:translateX(20px);max-width:290px;box-shadow:0 6px 24px rgba(0,0,0,0.5);display:flex;align-items:center;gap:10px;';
                document.body.appendChild(el);
            }
            const icon = text.slice(0,2);
            const msg = text.slice(2).trim();
            el.innerHTML = `<span style="font-size:20px;flex-shrink:0;">${icon}</span><span style="flex:1;line-height:1.4;">${esc(msg)}</span>`;
            el.style.opacity = '1';
            el.style.transform = 'translateX(0)';
            clearTimeout(el._t);
            el._t = setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; }, 4000);
        }

        let postsRealtimeChannel = null;
        function subscribePosts() {
            if (!currentUser) return;
            try {
                if (postsRealtimeChannel) SB.removeChannel(postsRealtimeChannel);
                postsRealtimeChannel = SB.channel('niji_posts')
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'posts'
                    }, payload => {
                        // Если мы на ленте — добавляем пост сразу без перезагрузки
                        if (page === 'feed') {
                            prependNewPost(payload.new);
                        }
                    })
                    .subscribe();
            } catch(e) {
                console.warn('Posts realtime error:', e);
            }
        }

        async function prependNewPost(post) {
            if (!post) return;
            // Не дублируем свой только что опубликованный пост
            if (document.getElementById('post-' + post.id)) return;
            const mc = document.getElementById('mainContainer');
            if (!mc) return;
            const postHtml = buildPostCard(post);
            // Вставляем после формы поста (первая .card)
            const firstCard = mc.querySelector('.card');
            if (firstCard) {
                firstCard.insertAdjacentHTML('afterend', postHtml);
            }
        }

        let notifRealtimeChannel = null;
        let notifPollInterval = null;
        let lastNotifCount = 0;
        let lastNotifIds = new Set();
        let notifSystemReady = false; // флаг: начальная загрузка завершена

        function subscribeNotifications() {
            if (!currentUser) return;

            // Сначала грузим существующие уведомления и запоминаем их ID
            // чтобы при первом poll не показывать тосты за старые уведомления
            SB.from('notifications')
                .select('id')
                .eq('user_login', currentUser.login)
                .order('created_at', { ascending: false })
                .limit(100)
                .then(({ data: existing }) => {
                    (existing || []).forEach(n => lastNotifIds.add(String(n.id)));
                    notifSystemReady = true;
                    loadNotifications();
                });

            // Realtime через Supabase Postgres Changes с фильтром по user_login
            try {
                if (notifRealtimeChannel) SB.removeChannel(notifRealtimeChannel);
                notifRealtimeChannel = SB.channel('niji_notif_' + currentUser.login)
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'notifications',
                        filter: `user_login=eq.${currentUser.login}`
                    }, payload => {
                        if (payload.new?.user_login !== currentUser.login) return;
                        // Показываем тост только если это реально новое уведомление
                        if (!lastNotifIds.has(String(payload.new.id))) {
                            loadNotifications();
                            const n = payload.new;
                            const icon = NOTIF_ICONS[n.type] || '🔔';
                            const displayText = (n.text || 'Новое уведомление').replace(/\s*\[post_id:\d+\]/, '');
                            showNotifToast(icon + ' ' + displayText);
                            lastNotifIds.add(String(n.id));
                        }
                    })
                    .subscribe(status => {
                        if (status === 'SUBSCRIBED') {
                            if (notifPollInterval) clearInterval(notifPollInterval);
                            notifPollInterval = setInterval(() => pollNewNotifs(), 15000);
                        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                            startFallbackPolling();
                        }
                    });
            } catch(e) {
                startFallbackPolling();
            }
        }

        function startFallbackPolling() {
            if (notifPollInterval) clearInterval(notifPollInterval);
            notifPollInterval = setInterval(() => pollNewNotifs(), 2000);
        }

        async function pollNewNotifs() {
            if (!currentUser || !notifSystemReady) return;
            const { data: notifs } = await SB.from('notifications')
                .select('*')
                .eq('user_login', currentUser.login)
                .eq('is_read', false)
                .order('created_at', { ascending: false })
                .limit(20);

            const newOnes = (notifs || []).filter(n => !lastNotifIds.has(String(n.id)));
            if (newOnes.length > 0) {
                loadNotifications();
                newOnes.forEach(n => {
                    const icon = NOTIF_ICONS[n.type] || '🔔';
                    const displayText = (n.text || 'Новое уведомление').replace(/\s*\[post_id:\d+\]/, '');
                    showNotifToast(icon + ' ' + displayText);
                });
            }
            (notifs || []).forEach(n => lastNotifIds.add(String(n.id)));
        }

            const chatHtml = chatMsgs.map(m => {
                const isMine = m.user_login === currentUser.login;
                const u = { login: m.user_login, username: m.username, avatar_url: m.avatar_url };
                const t = new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                return `<div style="display:flex;gap:7px;align-items:flex-start;margin-bottom:8px;${isMine ? 'flex-direction:row-reverse;' : ''}">
                    <div style="flex-shrink:0;cursor:pointer;" onclick="goProfile('${m.user_login}')">${buildAvatarHtml(u, 26, 10)}</div>
                    <div style="max-width:78%;">
                        ${!isMine ? `<div style="font-size:10px;color:var(--text2);margin-bottom:3px;font-weight:500;">${esc(m.username)}</div>` : ''}
                        <div style="background:${isMine ? 'linear-gradient(135deg,#ff6b9d,#c44569)' : 'rgba(255,255,255,0.08)'};color:#fff;padding:7px 11px;border-radius:${isMine ? '14px 14px 4px 14px' : '14px 14px 14px 4px'};font-size:12px;line-height:1.5;word-break:break-word;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,0.2);">${esc(m.text)}</div>
                        <div style="font-size:9px;color:rgba(255,255,255,0.3);margin-top:3px;text-align:${isMine ? 'right' : 'left'};">${t}</div>
                    </div>
                </div>`;
            }).join('');

            // Определяем тип видео
            let videoHtml = '';
            if (room.video_url) {
                const url = room.video_url;
                const isYoutube = url.includes('youtube.com') || url.includes('youtu.be');
                const isVk = url.includes('vk.com/video') || url.includes('vk.com/clip') || url.includes('vkvideo.ru');
                const isIframe = url.includes('youtube.com/embed') || url.includes('iframe') || url.includes('kodik.info') || url.includes('kodik.biz') || url.includes('aniboom') || url.includes('sibnet') || url.includes('vk.com/video_ext') || url.includes('vkvideo.ru');
                if (isYoutube) {
                    let embedUrl = url;
                    if (url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/').replace('youtube.com/watch', 'youtube.com/embed');
                    else if (url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
                    if (!embedUrl.includes('?')) embedUrl += '?autoplay=0';
                    else embedUrl += '&autoplay=0';

                    videoHtml = `<div style="position:relative;width:100%;aspect-ratio:16/9;">
                        <iframe id="roomVideo" src="${esc(embedUrl)}"
                            style="width:100%;height:100%;border:none;border-radius:10px;display:block;"
                            allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
                    </div>`;
                } else if (isVk) {
                    // ВКонтакте — конвертируем ссылку в embed
                    // Форматы: vk.com/video-123_456, vk.com/video?z=video-123_456, vkvideo.ru/video-123_456
                    let embedUrl = url;
                    if (!url.includes('video_ext.php')) {
                        const match = url.match(/video(-?\d+)_(\d+)/);
                        if (match) {
                            embedUrl = `https://vk.com/video_ext.php?oid=${match[1]}&id=${match[2]}&hd=2&js_api=1`;
                        }
                    } else if (!embedUrl.includes('js_api')) {
                        embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'js_api=1';
                    }
                    videoHtml = `<iframe id="roomVideo" src="${esc(embedUrl)}"
                        style="width:100%;aspect-ratio:16/9;border:none;border-radius:10px;display:block;"
                        allowfullscreen allow="autoplay; fullscreen; encrypted-media"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>`;
                } else if (isIframe) {
                    // Другой embed iframe (Kodik и т.д.)
                    videoHtml = `<iframe id="roomVideo" src="${esc(url)}" style="width:100%;aspect-ratio:16/9;border:none;border-radius:10px;display:block;" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>`;
                } else {
                    // Прямой MP4 или другой
                    videoHtml = `<video id="roomVideo" src="${esc(url)}" style="width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;display:block;" controls preload="metadata" playsinline webkit-playsinline
                        ontimeupdate="if(${isOwner})syncVideoState(this)"
                        onplay="if(${isOwner})syncVideoPlaying(true,this.currentTime)"
                        onpause="if(${isOwner})syncVideoPlaying(false,this.currentTime)">
                        Видео не поддерживается
                    </video>`;
                }
            } else {
                videoHtml = `<div style="width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#0a0a1a,#1a1026);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text2);">
                    <div style="font-size:48px;">🎌</div>
                    <div style="font-size:13px;">Нет видео</div>
                    ${isOwner ? `<button onclick="openSetVideoModal()" class="btn btn-outline btn-sm">📎 Добавить видео</button>` : '<div style="font-size:12px;">Ждём пока владелец добавит видео...</div>'}
                </div>`;
            }

            mc.innerHTML = `
            <!-- Шапка комнаты — стеклянная -->
            <div style="background:rgba(18,18,26,0.8);backdrop-filter:blur(20px);border:1px solid rgba(255,107,157,0.2);border-radius:16px;padding:12px 16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,0.4);">
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <button onclick="leaveRoom()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--text2);border-radius:10px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,71,87,0.15)';this.style.color='#ff4757'" onmouseout="this.style.background='rgba(255,255,255,0.06)';this.style.color='var(--text2)'">← Выйти</button>
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(room.title)}</div>
                        ${room.anime_title ? `<div style="font-size:11px;color:var(--blue);margin-top:1px;">📺 ${esc(room.anime_title)}</div>` : ''}
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                        <span style="font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(46,213,115,0.12);color:var(--green);border:1px solid rgba(46,213,115,0.25);">🟢 ${(members || []).length} онлайн</span>
                        ${isOwner ? `<button onclick="openSetVideoModal()" style="background:rgba(77,201,246,0.12);border:1px solid rgba(77,201,246,0.3);color:var(--blue);border-radius:10px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;">📎 Видео</button>` : ''}
                        ${isOwner ? `<span style="font-size:10px;padding:2px 8px;background:linear-gradient(90deg,#ff6b9d22,#4dc9f622);border:1px solid rgba(255,107,157,0.3);color:var(--pink);border-radius:8px;font-weight:600;">👑 Создатель</span>` : ''}
                    </div>
                </div>
            </div>

            <!-- Основной грид: видео + сайдбар -->
            <div style="display:flex;flex-direction:column;gap:12px;" id="roomGrid">

                <!-- Левая: видео + управление -->
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <div style="position:relative;background:rgba(10,10,15,0.9);border:1px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.6);">
                        ${videoHtml}
                        ${!isOwner ? `<div id="syncPlayBtn" onclick="syncPlayBtn_click()" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.7);border-radius:16px;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;z-index:10;">
                            <div style="font-size:48px;">▶</div>
                            <div style="font-size:14px;font-weight:700;color:#fff;">Нажми чтобы смотреть вместе</div>
                        </div>` : ''}
                    </div>
                    ${room.video_url && !room.video_url.includes('youtube.com/embed') && !room.video_url.includes('youtu.be') && !room.video_url.includes('iframe') ? `
                    <div style="display:flex;gap:8px;">
                        <button onclick="${isOwner ? 'ownerPlay()' : 'alert(\"Только создатель комнаты может управлять воспроизведением\")'}" style="flex:1;background:${isOwner ? 'linear-gradient(135deg,#2ed573,#1e8449)' : 'rgba(46,213,115,0.15)'};color:${isOwner ? '#fff' : '#2ed573'};border:${isOwner ? 'none' : '1px solid rgba(46,213,115,0.3)'};border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:${isOwner ? '0 4px 15px rgba(46,213,115,0.3)' : 'none'};transition:transform 0.2s;opacity:${isOwner ? '1' : '0.6'};" ${isOwner ? 'onmouseover="this.style.transform=\'scale(1.02)\'" onmouseout="this.style.transform=\'scale(1)\'"' : ''}>▶ Play для всех</button>
                        <button onclick="${isOwner ? 'ownerPause()' : 'alert(\"Только создатель комнаты может управлять воспроизведением\")'}" style="flex:1;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.2s;opacity:${isOwner ? '1' : '0.6'};" ${isOwner ? 'onmouseover="this.style.background=\'rgba(255,255,255,0.1)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.06)\'"' : ''}>⏸ Стоп для всех</button>
                        <button onclick="toggleFullscreen()" style="background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 14px;font-size:16px;cursor:pointer;transition:all 0.2s;" title="Полный экран" onmouseover="this.style.background='rgba(255,255,255,0.12)'" onmouseout="this.style.background='rgba(255,255,255,0.06)'">⛶</button>
                    </div>` : room.video_url ? `
                    <div style="display:flex;justify-content:flex-end;">
                        <button onclick="toggleFullscreen()" style="background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:8px 16px;font-size:15px;cursor:pointer;transition:all 0.2s;" title="Полный экран" onmouseover="this.style.background='rgba(255,255,255,0.12)'" onmouseout="this.style.background='rgba(255,255,255,0.06)'">⛶ Полный экран</button>
                    </div>` : ''}
                </div>

                <!-- Правая: участники + чат -->
                <div style="display:flex;flex-direction:column;gap:10px;">

                    <!-- Участники -->
                    <div style="background:rgba(18,18,26,0.8);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:12px;">
                        <div style="font-weight:600;font-size:12px;margin-bottom:10px;color:var(--text2);letter-spacing:0.5px;text-transform:uppercase;">👥 Участники — ${(members || []).length}</div>
                        <div id="roomMembers" style="display:flex;flex-direction:column;gap:2px;">${membersHtml || '<span style="color:var(--text2);font-size:12px;">Никого нет</span>'}</div>
                    </div>

                    <!-- Чат -->
                    <div style="background:rgba(18,18,26,0.8);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:12px;display:flex;flex-direction:column;height:280px;">
                        <div style="font-weight:600;font-size:12px;margin-bottom:10px;color:var(--text2);letter-spacing:0.5px;text-transform:uppercase;">💬 Чат комнаты</div>
                        <div id="roomChat" style="flex:1;overflow-y:auto;margin-bottom:8px;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(255,107,157,0.3) transparent;">
                            ${chatHtml || '<div style="color:var(--text2);font-size:12px;text-align:center;padding:20px 0;opacity:0.6;">Начни общение! 💬</div>'}
                        </div>
                        <div style="display:flex;gap:6px;align-items:center;">
                            <input id="roomChatInput" placeholder="Написать..." 
                                style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:8px 14px;color:var(--text);font-size:12px;font-family:inherit;outline:none;transition:border 0.2s;"
                                onfocus="this.style.borderColor='rgba(255,107,157,0.5)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'"
                                onkeydown="if(event.key==='Enter')sendRoomChat()">
                            <button onclick="sendRoomChat()" style="background:linear-gradient(135deg,var(--pink),#c44569);border:none;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 10px rgba(255,107,157,0.4);transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">→</button>
                        </div>
                    </div>
                </div>
            </div>`;

            // Скроллим чат вниз
            setTimeout(() => {
                const chatEl = document.getElementById('roomChat');
                if (chatEl) chatEl.scrollTop = chatEl.scrollHeight;
            }, 100);

            // Адаптив для мобильного
            const grid = document.getElementById('roomGrid');
            if (grid) {
                if (window.innerWidth < 700) {
                    grid.style.gridTemplateColumns = '1fr';
                }
                window.addEventListener('resize', () => {
                    grid.style.gridTemplateColumns = window.innerWidth < 700 ? '1fr' : '1fr 300px';
                }, { once: true });
            }

            // Синхронизация видео для зрителей
            if (!isOwner && room.video_url && !room.video_url.includes('embed')) {
                setTimeout(() => applyVideoState(room), 500);
            }
        }

        function openSetVideoModal() {
            const existing = document.getElementById('setVideoModal');
            if (existing) existing.remove();
            const modal = document.createElement('div');
            modal.id = 'setVideoModal';
            modal.className = 'modal-overlay';
            modal.style.display = 'flex';
            modal.innerHTML = `
            <div class="modal" style="width:420px;">
                <h2 style="margin-bottom:12px;">📎 Сменить видео</h2>
                <input id="newVideoUrl" placeholder="Ссылка на видео (MP4, VK, Kodik, Sibnet...)" style="margin-bottom:4px;">
                <div style="font-size:11px;color:var(--text2);margin-bottom:8px;">MP4: прямая ссылка. VK: vk.com/video-123_456. Kodik/Sibnet: embed-ссылка</div>
                <div style="font-size:11px;background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.25);border-radius:8px;padding:8px 10px;margin-bottom:14px;color:#ff8a8a;line-height:1.5;">⚠️ <strong>YouTube не работает</strong> — они блокируют встраивание в сторонние сайты. Используй Kodik или MP4.</div>
                <button class="btn-full" onclick="setRoomVideo()">Сохранить</button>
                <button class="btn-link" onclick="document.getElementById('setVideoModal').remove()">Отмена</button>
            </div>`;
            modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
            document.body.appendChild(modal);
        }

        async function setRoomVideo() {
            const url = document.getElementById('newVideoUrl')?.value.trim();
            if (!url) return toast('Введи ссылку!', true);
            await SB.from('anime_rooms').update({ video_url: url, playback_time: 0, is_playing: false, updated_at: new Date().toISOString() }).eq('id', currentRoom);
            document.getElementById('setVideoModal')?.remove();
            toast('✅ Видео обновлено!');
            await renderRoomInside();
        }

        // Полноэкранный режим
        function toggleFullscreen() {
            const video = document.getElementById('roomVideo');
            if (!video) return;
            const el = video.tagName === 'IFRAME' ? video : video;
            if (!document.fullscreenElement) {
                (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen).call(el);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document);
            }
        }

        // Синхронизация состояния видео (владелец → все)
        async function syncVideoState(video) {
            await SB.from('anime_rooms').update({
                playback_time: video.currentTime,
                is_playing: !video.paused,
                updated_at: new Date().toISOString()
            }).eq('id', currentRoom);
        }

        async function syncVideoPlaying(isPlaying, time) {
            await SB.from('anime_rooms').update({
                is_playing: isPlaying,
                playback_time: time,
                updated_at: new Date().toISOString()
            }).eq('id', currentRoom);
        }

        // Управление ВК плеером через postMessage
        function vkPlayerSend(action) {
            const iframe = document.getElementById('roomVideo');
            if (!iframe || iframe.tagName !== 'IFRAME') return;
            const src = iframe.src || '';
            if (!src.includes('vk.com')) return;
            try {
                iframe.contentWindow.postMessage(JSON.stringify({ method: action }), 'https://vk.com');
            } catch(e) {}
        }

        async function syncPlayBtn_click() {
            const btn = document.getElementById('syncPlayBtn');
            if (btn) btn.style.display = 'none';
            const { data: room } = await SB.from('anime_rooms').select('*').eq('id', currentRoom).single();
            if (room) applyVideoState(room);
        }

        async function ownerPlay() {
            const el = document.getElementById('roomVideo');
            if (!el) return toast('Видео не найдено', true);
            if (el.tagName === 'VIDEO') {
                try { await el.play(); } catch(e) { toast('Ошибка: ' + e.message, true); return; }
                await syncVideoPlaying(true, el.currentTime || 0);
            } else {
                // iframe — пробуем postMessage для ВК
                vkPlayerSend('play');
                await syncVideoPlaying(true, 0);
                toast('▶ Сигнал Play отправлен всем');
            }
        }
        async function ownerPause() {
            const el = document.getElementById('roomVideo');
            if (!el) return toast('Видео не найдено', true);
            if (el.tagName === 'VIDEO') {
                try { el.pause(); } catch(e) {}
                await syncVideoPlaying(false, el.currentTime || 0);
            } else {
                vkPlayerSend('pause');
                await syncVideoPlaying(false, 0);
                toast('⏸ Сигнал Стоп отправлен всем');
            }
        }

        function applyVideoState(room) {
            const el = document.getElementById('roomVideo');
            if (!el) return;
            if (el.tagName === 'VIDEO') {
                const diff = Math.abs(el.currentTime - room.playback_time);
                if (diff > 2) el.currentTime = room.playback_time;
                if (room.is_playing && el.paused) {
                    el.play().catch(() => {
                        const btn = document.getElementById('syncPlayBtn');
                        if (btn) btn.style.display = 'flex';
                    });
                }
                if (!room.is_playing && !el.paused) el.pause();
            } else {
                // iframe — управляем через postMessage (работает для ВК с js_api=1)
                const isOwnerNow = room.owner_login === currentUser?.login || DEVS.includes(currentUser?.login?.toLowerCase());
                if (room.is_playing) {
                    vkPlayerSend('play');
                    if (!isOwnerNow) showRoomNotif('▶ Создатель нажал Play');
                } else {
                    vkPlayerSend('pause');
                    if (!isOwnerNow) showRoomNotif('⏸ Создатель поставил паузу');
                }
            }
        }

        function showRoomNotif(text) {
            let el = document.getElementById('roomNotif');
            if (!el) {
                el = document.createElement('div');
                el.id = 'roomNotif';
                el.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff6b9d,#c44569);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.3s;text-align:center;max-width:280px;box-shadow:0 4px 20px rgba(255,107,157,0.5);';
                document.body.appendChild(el);
            }
            el.textContent = text;
            el.style.opacity = '1';
            clearTimeout(el._t);
            el._t = setTimeout(() => { el.style.opacity = '0'; }, 4000);
        }

        async function sendRoomChat() {
            const input = document.getElementById('roomChatInput');
            const text = input?.value.trim();
            if (!text || !currentRoom) return;
            input.value = '';
            await SB.from('anime_room_chat').insert([{
                room_id: currentRoom,
                user_login: currentUser.login,
                username: currentUser.username,
                avatar_url: currentUser.avatar_url || null,
                text
            }]);
        }

        function appendRoomChatMsg(m) {
            const chatEl = document.getElementById('roomChat');
            if (!chatEl) return;
            // Remove "no messages" placeholder
            const placeholder = chatEl.querySelector('div[style*="Начни общение"]');
            if (placeholder) placeholder.remove();
            const isMine = m.user_login === currentUser.login;
            const u = { login: m.user_login, username: m.username, avatar_url: m.avatar_url };
            const t = new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const div = document.createElement('div');
            div.style.cssText = `display:flex;gap:7px;align-items:flex-start;margin-bottom:8px;${isMine ? 'flex-direction:row-reverse;' : ''}`;
            div.innerHTML = `<div style="flex-shrink:0;cursor:pointer;" onclick="goProfile('${m.user_login}')">${buildAvatarHtml(u, 26, 10)}</div>
                <div style="max-width:78%;">
                    ${!isMine ? `<div style="font-size:10px;color:var(--text2);margin-bottom:3px;font-weight:500;">${esc(m.username)}</div>` : ''}
                    <div style="background:${isMine ? 'linear-gradient(135deg,#ff6b9d,#c44569)' : 'rgba(255,255,255,0.08)'};color:#fff;padding:7px 11px;border-radius:${isMine ? '14px 14px 4px 14px' : '14px 14px 14px 4px'};font-size:12px;line-height:1.5;word-break:break-word;backdrop-filter:blur(4px);">${esc(m.text)}</div>
                    <div style="font-size:9px;color:rgba(255,255,255,0.3);margin-top:3px;text-align:${isMine ? 'right' : 'left'};">${t}</div>
                </div>`;
            chatEl.appendChild(div);
            const atBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 80;
            if (atBottom) chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function refreshRoomMembers() {
            if (!currentRoom) return;
            const cutoff = new Date(Date.now() - 5 * 60 * 1000).toISOString();
            const { data: members } = await SB.from('anime_room_members')
                .select('*').eq('room_id', currentRoom).gte('last_seen', cutoff);
            const el = document.getElementById('roomMembers');
            if (!el) return;
            const { data: room } = await SB.from('anime_rooms').select('owner_login').eq('id', currentRoom).single();
            el.innerHTML = (members || []).map(m => {
                const u = { login: m.user_login, username: m.username, avatar_url: m.avatar_url };
                const isOwner = room && m.user_login === room.owner_login;
                return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;">
                    ${buildAvatarHtml(u, 24, 10)}
                    <span style="font-size:12px;">${esc(m.username)}</span>
                    ${isOwner ? '<span style="font-size:10px;color:var(--pink);font-weight:700;">👑</span>' : ''}
                </div>`;
            }).join('') || '<span style="color:var(--text2);font-size:12px;">Никого нет</span>';
        }

        function startRoomRealtime(roomId) {
            // Убираем старые каналы
            if (roomChatChannel) SB.removeChannel(roomChatChannel);
            if (roomSyncChannel) SB.removeChannel(roomSyncChannel);
            if (roomMembersChannel) SB.removeChannel(roomMembersChannel);

            // Realtime чат
            roomChatChannel = SB.channel('room_chat_' + roomId)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'anime_room_chat', filter: `room_id=eq.${roomId}` }, payload => {
                    if (payload.new) appendRoomChatMsg(payload.new);
                })
                .subscribe();

            // Realtime синхронизация видео (только для зрителей)
            roomSyncChannel = SB.channel('room_sync_' + roomId)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'anime_rooms', filter: `id=eq.${roomId}` }, payload => {
                    if (payload.new) applyVideoState(payload.new);
                })
                .subscribe();

            // Realtime участники
            roomMembersChannel = SB.channel('room_members_' + roomId)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'anime_room_members', filter: `room_id=eq.${roomId}` }, () => {
                    refreshRoomMembers();
                })
                .subscribe();
        }
        // ============================================================
        // Polling уведомлений управляется через subscribeNotifications()
        init();
    </script>
</body>
</html>
