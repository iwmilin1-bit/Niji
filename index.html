<!DOCTYPE html>
<!--
=== SUPABASE SQL — выполни в SQL Editor ===

-- 1. Таблица уведомлений
create table if not exists notifications (
  id bigint generated always as identity primary key,
  user_login text not null,
  type text,
  text text,
  is_read boolean default false,
  created_at timestamptz default now()
);
alter table notifications enable row level security;
create policy "anyone can insert notifications" on notifications for insert with check (true);
create policy "users can read own notifications" on notifications for select using (true);
create policy "users can update own notifications" on notifications for update using (true);

-- 2. RLS для verification_requests (если ещё не настроен)
alter table verification_requests enable row level security;
create policy "anyone can insert verification_requests" on verification_requests for insert with check (true);
create policy "anyone can select verification_requests" on verification_requests for select using (true);
create policy "anyone can update verification_requests" on verification_requests for update using (true);

-- 3. RLS для messages
-- ВАЖНО: добавь колонку для фото если ещё нет:
alter table messages add column if not exists image_url text;
alter table messages enable row level security;
create policy "anyone can insert messages" on messages for insert with check (true);
create policy "anyone can select messages" on messages for select using (true);
create policy "anyone can delete messages" on messages for delete using (true);

-- 3. Колонка avatar_url в users (если нет)
alter table users add column if not exists avatar_url text;

-- 3а. Колонки avatar_url, level и photo_frame в posts
alter table posts add column if not exists avatar_url text;
alter table posts add column if not exists level int default 1;
alter table posts add column if not exists photo_frame text;

-- 4. БАН: колонка is_banned в users
alter table users add column if not exists is_banned boolean default false;
alter table users add column if not exists ban_reason text;

-- 5. REALTIME для уведомлений (выполни чтобы уведомления приходили мгновенно)
alter publication supabase_realtime add table notifications;

-- 6. Лайки на комментарии
create table if not exists comment_likes (
  id bigint generated always as identity primary key,
  comment_id bigint not null,
  user_login text not null,
  created_at timestamptz default now(),
  unique(comment_id, user_login)
);
alter table comment_likes enable row level security;
create policy "anyone can insert comment_likes" on comment_likes for insert with check (true);
create policy "anyone can select comment_likes" on comment_likes for select using (true);
create policy "anyone can delete comment_likes" on comment_likes for delete using (true);

-- 7. Ответы на комментарии (добавить колонки в comments)
alter table comments add column if not exists reply_to_id bigint;
alter table comments add column if not exists reply_to_username text;

-- 8. Голосовые в комментариях
alter table comments add column if not exists audio_url text;

-- 9. Поле from_login в notifications (кто отправил уведомление)
alter table notifications add column if not exists from_login text;

-- 10. Биография пользователя
alter table users add column if not exists bio text;

-- 11. Рамка аватара
alter table users add column if not exists avatar_frame text;

-- 12. DEV медаль (выдаётся только девами)
alter table users add column if not exists dev_medal text;

===========================================

=== КОМНАТЫ ДЛЯ ПРОСМОТРА АНИМЕ — выполни в SQL Editor ===

create table if not exists anime_rooms (
  id bigint generated always as identity primary key,
  title text not null,
  anime_title text,
  video_url text,
  owner_login text not null,
  is_playing boolean default false,
  playback_time float default 0,
  updated_at timestamptz default now(),
  created_at timestamptz default now()
);
alter table anime_rooms enable row level security;
create policy "anyone can select anime_rooms" on anime_rooms for select using (true);
create policy "anyone can insert anime_rooms" on anime_rooms for insert with check (true);
create policy "anyone can update anime_rooms" on anime_rooms for update using (true);
create policy "anyone can delete anime_rooms" on anime_rooms for delete using (true);

create table if not exists anime_room_members (
  id bigint generated always as identity primary key,
  room_id bigint not null references anime_rooms(id) on delete cascade,
  user_login text not null,
  username text not null,
  avatar_url text,
  joined_at timestamptz default now(),
  last_seen timestamptz default now(),
  unique(room_id, user_login)
);
alter table anime_room_members enable row level security;
create policy "anyone can select anime_room_members" on anime_room_members for select using (true);
create policy "anyone can insert anime_room_members" on anime_room_members for insert with check (true);
create policy "anyone can update anime_room_members" on anime_room_members for update using (true);
create policy "anyone can delete anime_room_members" on anime_room_members for delete using (true);

create table if not exists anime_room_chat (
  id bigint generated always as identity primary key,
  room_id bigint not null references anime_rooms(id) on delete cascade,
  user_login text not null,
  username text not null,
  avatar_url text,
  text text not null,
  created_at timestamptz default now()
);
alter table anime_room_chat enable row level security;
create policy "anyone can select anime_room_chat" on anime_room_chat for select using (true);
create policy "anyone can insert anime_room_chat" on anime_room_chat for insert with check (true);
create policy "anyone can delete anime_room_chat" on anime_room_chat for delete using (true);

alter publication supabase_realtime add table anime_rooms;
alter publication supabase_realtime add table anime_room_members;
alter publication supabase_realtime add table anime_room_chat;

===========================================
-->
<html lang="ru">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>にじ Niji</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--pink:#ff6b9d;--blue:#4dc9f6;--green:#2ed573;--text:#e0e0e0;--text2:#8888aa;--border:#252535;--danger:#ff4757}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:url('https://wallpaperaccess.com/full/1886512.jpg');background-size:cover;background-attachment:fixed;background-position:center top;background-repeat:no-repeat;}
        body::before{display:none;}
        .container{position:relative;z-index:1;}
        #mainContainer{position:relative;z-index:1;}
        .header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .logo{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;transition:transform 0.2s ease}
        .logo:hover{transform:scale(1.05)}
        .header-right{display:flex;gap:10px;align-items:center}
        .btn{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all 0.2s ease}
        .btn-pink{background:var(--pink);color:#fff}
        .btn-pink:hover{background:#ff85b0;transform:scale(1.03)}
        .btn-outline{background:transparent;border:1px solid var(--blue);color:var(--blue)}
        .btn-sm{padding:5px 12px;font-size:11px}
        .btn-back{background:var(--surface2);color:var(--text);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);font-family:inherit}
        .btn-msg{background:var(--blue);color:#000;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
        .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;transition:transform 0.2s ease, box-shadow 0.2s ease}
        .avatar:hover{transform:scale(1.1);box-shadow:0 0 0 3px rgba(255,107,157,0.2)}
        .avatar-lg{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content-center;color:#fff;font-weight:700;font-size:28px;margin:0 auto}
        .dropdown{position:absolute;top:40px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;min-width:150px;display:none;z-index:200}
        .dropdown.show{display:block}
        .dropdown button{display:block;width:100%;background:none;border:none;color:var(--text);padding:8px 14px;cursor:pointer;font-size:13px;text-align:left;border-radius:8px;font-family:inherit}
        .dropdown button:hover{background:var(--surface2)}
        .user-badge{display:flex;align-items:center;gap:8px;cursor:pointer;position:relative}
        .notif-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 20px;font-size:11px;display:flex;justify-content:space-between}
        .nav-tabs{display:flex;gap:16px;margin-bottom:14px}
        .nav-tab{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;font-family:inherit;padding:4px 0;border-bottom:2px solid transparent;font-weight:500}
        .nav-tab.active{color:var(--text);border-bottom-color:var(--pink)}
        .container{max-width:650px;margin:16px auto;padding:0 16px}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;transition:all 0.2s ease;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
        .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.3);border-color:#3a3a4a}
        textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);font-family:inherit;font-size:13px;resize:vertical;min-height:50px;margin-bottom:8px}
        textarea:focus{outline:none;border-color:var(--blue)}
        .row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        .tag{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.2s ease}
        .tag:hover{background:#2a2a38;border-color:var(--blue);color:var(--text)}
        .post-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
        .post-name{font-weight:600;font-size:13px;cursor:pointer}
        .post-name:hover{color:var(--blue)}
        .post-time{font-size:11px;color:var(--text2)}
        .post-text{font-size:13px;line-height:1.5;margin:8px 0}
        .post-tag{display:inline-block;background:var(--surface2);padding:2px 8px;border-radius:8px;font-size:10px;color:var(--blue);margin-bottom:6px}
        .actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid var(--border)}
        .act{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit}
        .act:hover{color:var(--text)}
        .act.liked{color:var(--pink)}
        .comments-box{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
        .comment{font-size:12px;padding:3px 0}
        .comment-input{display:flex;gap:6px;margin-top:6px}
        .comment-input input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:15px;padding:6px 12px;color:var(--text);font-size:11px;font-family:inherit}
        .tabs{display:flex;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px}
        .tab{flex:1;background:none;border:none;color:var(--text2);padding:10px;cursor:pointer;font-size:13px;font-family:inherit;text-align:center}
        .tab.active{background:var(--pink);color:#fff;font-weight:600}
        .guest-row,.dialog-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:6px;cursor:pointer;transition:border-color 0.2s}
        .dialog-row:hover,.guest-row:hover{border-color:var(--blue)}
        .dialog-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
        .dialog-info{flex:1}
        .dialog-name{font-weight:600;font-size:14px}
        .dialog-last{font-size:12px;color:var(--text2);margin-top:2px}
        .dialog-time{font-size:10px;color:var(--text2)}
        .msg-bubble{max-width:80%;padding:10px 14px;border-radius:16px;margin:6px 0;font-size:13px;line-height:1.4}
        .msg-sent{background:var(--pink);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
        .msg-received{background:var(--surface2);color:var(--text);border-bottom-left-radius:4px}
        .msg-input-area{display:flex;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;position:sticky;bottom:0;margin-top:10px}
        .msg-input-area input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:13px}
        .msg-input-area input:focus{outline:none;border-color:var(--blue)}
        .emoji-btn {
            font-size: 18px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .emoji-btn:hover {
            background: #2a2a38;
        }
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;display:flex;align-items:center;justify-content:center}
        .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:400px;max-width:90vw;max-height:80vh;overflow-y:auto}
        .modal h2{font-size:18px;margin-bottom:12px}
        .modal input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);margin-bottom:8px;font-family:inherit}
        .modal .btn-full{width:100%;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border:none;background:var(--pink);color:#fff;margin-bottom:8px}
        .modal .btn-link{width:100%;background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;font-family:inherit;margin-top:4px}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue);color:#000;padding:10px 22px;border-radius:25px;font-weight:600;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.3s}
        .toast.show{opacity:1}
        /* Адаптивная сетка комнаты */
        @media (min-width: 700px) {
            #roomGrid { display: grid !important; grid-template-columns: 1fr 280px; align-items: start; }
        }

        .toast.error{background:var(--danger);color:#fff}

        /* Колокольчик уведомлений */
        .notif-bell {
            position: relative;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            font-size: 16px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .notif-bell:hover { background: #2a2a38; border-color: var(--blue); }
        .notif-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--pink);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
            border: 2px solid var(--bg);
            pointer-events: none;
        }
        /* Панель уведомлений */
        .notif-panel {
            position: absolute;
            top: 46px;
            right: 0;
            width: 340px;
            max-height: 480px;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            z-index: 300;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            display: none;
            animation: notifSlideIn 0.18s ease;
        }
        
        @keyframes likepop {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.5); }
            70%  { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .cl-like-btn { transition: color 0.2s ease; }
        .cl-like-btn.liked { color: var(--pink) !important; }
        .cl-like-btn:active { transform: scale(0.92); }
        /* === Рамки аватара === */
        .avatar-frame-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .avatar-frame-wrap .av-frame {
            position: absolute; inset: -4px; border-radius: 50%; pointer-events: none; z-index: 1;
        }
        .avatar-frame-wrap img,
        .avatar-frame-wrap .avatar,
        .avatar-frame-wrap > *:not(.av-frame) {
            position: relative; z-index: 3;
        }
        /* Огонь — Танджиро */
        @keyframes frameFireSpin { 0%{filter:hue-rotate(0deg) brightness(1.1)} 50%{filter:hue-rotate(20deg) brightness(1.3)} 100%{filter:hue-rotate(0deg) brightness(1.1)} }
        .frame-tanjiro { background: conic-gradient(#ff4500,#ff6b00,#ffcc00,#ff4500); animation: frameFireSpin 2s infinite, frameSpin 6s linear infinite; }
        /* Гуль — Канеки */
        @keyframes frameGhoulPulse { 0%,100%{box-shadow:0 0 0 2px #8b0000,0 0 12px #8b0000} 50%{box-shadow:0 0 0 3px #cc0000,0 0 22px #ff0000} }
        .frame-kaneki { background: conic-gradient(#1a0000,#8b0000,#cc0000,#ff4444,#8b0000,#1a0000); animation: frameGhoulPulse 2s infinite, frameSpin 8s linear infinite; }
        /* Бензопила — Дэнджи */
        @keyframes frameChainsaw { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.4) saturate(1.5)} }
        .frame-denji { background: conic-gradient(#ff6b00,#ffaa00,#fff700,#ff6b00); animation: frameChainsaw 1.2s infinite, frameSpin 4s linear infinite; }
        /* Годзё — синий бесконечность */
        @keyframes frameGojo { 0%{box-shadow:0 0 0 2px #4dc9f6,0 0 15px #4dc9f6,inset 0 0 8px rgba(77,201,246,0.3)} 50%{box-shadow:0 0 0 3px #a29bfe,0 0 25px #6c5ce7,inset 0 0 12px rgba(162,155,254,0.4)} 100%{box-shadow:0 0 0 2px #4dc9f6,0 0 15px #4dc9f6,inset 0 0 8px rgba(77,201,246,0.3)} }
        .frame-gojo { background: conic-gradient(#4dc9f6,#a29bfe,#6c5ce7,#4dc9f6); animation: frameGojo 2s infinite, frameSpin 5s linear infinite; }
        /* Дракон */
        @keyframes frameDragon { 0%,100%{filter:hue-rotate(0deg)} 50%{filter:hue-rotate(30deg)} }
        .frame-dragon { background: conic-gradient(#2ed573,#00b894,#00cec9,#6c5ce7,#2ed573); animation: frameDragon 3s infinite, frameSpin 7s linear infinite; }
        /* Меч — Зоро */
        @keyframes frameSwordGlow { 0%,100%{box-shadow:0 0 6px #2ed573} 50%{box-shadow:0 0 18px #2ed573,0 0 30px rgba(46,213,115,0.4)} }
        .frame-zoro { background: conic-gradient(#1a4a1a,#2ed573,#a8e6cf,#2ed573,#1a4a1a); animation: frameSwordGlow 2s infinite, frameSpin 8s linear infinite; }
        /* Молния — Пикачу/Зэнитцу */
        @keyframes frameLightning { 0%,90%,100%{opacity:1} 91%,95%{opacity:0.6} 93%,97%{opacity:1} }
        .frame-lightning { background: conic-gradient(#f9ca24,#fff176,#f39c12,#f9ca24); animation: frameLightning 3s infinite, frameSpin 3s linear infinite; }
        /* Розовая магия — для новичков */
        .frame-pink { background: conic-gradient(#ff6b9d,#fd79a8,#ffeaa7,#ff6b9d); animation: frameSpin 6s linear infinite; }
        /* Золото — премиум DEV */
        @keyframes frameGold { 0%,100%{box-shadow:0 0 8px #f9ca24} 50%{box-shadow:0 0 20px #f9ca24,0 0 35px rgba(249,202,36,0.5)} }
        .frame-gold { background: conic-gradient(#f9ca24,#fff8dc,#f39c12,#ffd700,#f9ca24); animation: frameGold 2s infinite, frameSpin 4s linear infinite; }
        /* Специальная DEV рамка */
        @keyframes frameDevRainbow { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
        .frame-dev { background: conic-gradient(#ff6b9d,#f9ca24,#2ed573,#4dc9f6,#a29bfe,#ff6b9d); animation: frameDevRainbow 3s linear infinite, frameSpin 5s linear infinite; }
        /* Космическая DEV рамка */
        @keyframes frameCosmicPulse { 0%,100%{box-shadow:0 0 10px #6c5ce7,0 0 20px #a29bfe} 50%{box-shadow:0 0 20px #fd79a8,0 0 40px #6c5ce7,0 0 60px rgba(162,155,254,0.3)} }
        .frame-cosmic { background: conic-gradient(#0a0014,#6c5ce7,#a29bfe,#fd79a8,#f9ca24,#a29bfe,#0a0014); animation: frameCosmicPulse 2s infinite, frameSpin 6s linear infinite; }
        /* Матрица DEV рамка */
        @keyframes frameMatrixGlow { 0%,100%{filter:brightness(1) saturate(1)} 50%{filter:brightness(1.6) saturate(2) drop-shadow(0 0 8px #2ed573)} }
        .frame-matrix { background: conic-gradient(#003300,#2ed573,#00ff41,#2ed573,#003300); animation: frameMatrixGlow 1.5s infinite, frameSpin 4s linear infinite; }
        /* Кровь и огонь DEV рамка */
        @keyframes frameBloodFire { 0%{filter:hue-rotate(0deg) brightness(1)} 33%{filter:hue-rotate(-10deg) brightness(1.3)} 66%{filter:hue-rotate(10deg) brightness(0.9)} 100%{filter:hue-rotate(0deg) brightness(1)} }
        .frame-bloodfire { background: conic-gradient(#1a0000,#8b0000,#ff4500,#ff8c00,#ff4500,#8b0000,#1a0000); animation: frameBloodFire 2s infinite, frameSpin 5s linear infinite; }
        /* Кристалл DEV рамка */
        @keyframes frameCrystalShine { 0%,100%{box-shadow:0 0 8px #4dc9f6,0 0 16px rgba(77,201,246,0.4)} 25%{box-shadow:0 0 12px #fff,0 0 24px #4dc9f6} 50%{box-shadow:0 0 8px #a29bfe,0 0 20px rgba(162,155,254,0.5)} 75%{box-shadow:0 0 12px #fff,0 0 24px #fd79a8} }
        .frame-crystal { background: conic-gradient(#dfe6e9,#74b9ff,#fff,#a29bfe,#fd79a8,#fff,#74b9ff,#dfe6e9); animation: frameCrystalShine 2.5s infinite, frameSpin 8s linear infinite; }
        /* Общий спин */
        @keyframes frameSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

        @keyframes notifSlideIn {
            from { opacity:0; transform:translateY(-8px) scale(0.97); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }
        .notif-panel.show { display: block; }
        .notif-panel::-webkit-scrollbar { width: 4px; }
        .notif-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .notif-item {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            line-height: 1.4;

    <script>

            const { count: likes } = await SB.from('likes').select('*', { count: 'exact', head: true }).eq('post_id', postId);
            const { data: myLike } = currentUser
                ? await SB.from('likes').select('*').eq('post_id', postId).eq('user_login', currentUser?.login).single()
                : { data: null };
            const { count: coms } = await SB.from('comments').select('*', { count: 'exact', head: true }).eq('post_id', postId);
            const { data: comments } = await SB.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
            const lc = document.getElementById('lc-' + postId);
            if (lc) lc.textContent = likes || 0;
            const cc = document.getElementById('cc-' + postId);
            if (cc) cc.textContent = coms || 0;

            // Обновляем уровень в посте актуальным значением из БД
            const postEl = document.getElementById('post-' + postId);
            if (postEl) {
                const lvlBadge = postEl.querySelector('[data-lvl-badge]');
                if (lvlBadge) {
                    // Берём user_login из поста чтобы запросить актуальный level
                    const userLoginEl = postEl.querySelector('[data-user-login]');
                    const userLogin = userLoginEl ? userLoginEl.dataset.userLogin : null;
                    if (userLogin) {
                        // Используем кэш чтобы не делать запрос для каждого поста
                        if (!loadPostStats._lvlCache) loadPostStats._lvlCache = {};
                        if (!loadPostStats._lvlCache[userLogin]) {
                            const { data: u } = await SB.from('users').select('level').eq('login', userLogin).single();
                            loadPostStats._lvlCache[userLogin] = u ? (u.level || 1) : 1;
                        }
                        lvlBadge.textContent = 'LVL ' + loadPostStats._lvlCache[userLogin];
                    }
                }
            }

            // Восстанавливаем состояние кнопки лайка
            const btn = document.querySelector(`#post-${postId} .act`);
            if (btn) {
                if (myLike) {
                    btn.classList.add('liked');
                } else {
                    btn.classList.remove('liked');
                }
                // Отключаем кнопку если это свой пост
                const postEl = document.getElementById('post-' + postId);
                // Проверяем по data-атрибуту или через сравнение loginов (кнопка удаления есть только у своих постов)
                const isOwnPost = postEl && postEl.querySelector('.btn-msg[style*="danger"]');
                if (isOwnPost && currentUser) {
                    btn.style.opacity = '0.4';
                    btn.style.cursor = 'not-allowed';
                    btn.title = 'Нельзя лайкать свои посты';
                } else if (currentUser) {
                    btn.style.opacity = '';
                    btn.style.cursor = '';
                    btn.title = '';
                }
            }
            const box = document.getElementById('comments-' + postId);
            if (!box) return;

            // Аватарки авторов
            let userMap = {};
            if (comments && comments.length > 0) {
                const logins = [...new Set(comments.map(c => c.user_login))];
                const { data: usersData } = await SB.from('users').select('login, username, avatar_url, avatar_frame').in('login', logins);
                const avatarCache = JSON.parse(localStorage.getItem('niji_avatars') || '{}');
                (usersData || []).forEach(u => {
                    if (!u.avatar_url && avatarCache[u.login]) u.avatar_url = avatarCache[u.login];
                    userMap[u.login] = u;
                });
            }

            // Лайки на комментарии
            let commentLikesMap = {};
            let myCommentLikes = new Set();
            if (comments && comments.length > 0) {
                const ids = comments.map(c => c.id);
                const { data: clData } = await SB.from('comment_likes').select('comment_id, user_login').in('comment_id', ids);
                // Считаем только уникальные user_login на каждый комментарий (защита от дублей в БД)
                const seenLikes = {};
                (clData || []).forEach(cl => {
                    const key = cl.comment_id + '_' + cl.user_login;
                    if (seenLikes[key]) return;
                    seenLikes[key] = true;
                    commentLikesMap[cl.comment_id] = (commentLikesMap[cl.comment_id] || 0) + 1;
                    if (cl.user_login === currentUser?.login) myCommentLikes.add(cl.comment_id);
                });
            }

            const listEl = document.getElementById('comments-list-' + postId);
            if (listEl) {
                if (!comments || comments.length === 0) {
                    listEl.innerHTML = '<span style="color:var(--text2);font-size:12px;">Комментариев пока нет</span>';
                } else {
                    const roots = comments.filter(c => !c.reply_to_id);
                    const repliesMap = {};
                    const commentIds = new Set(comments.map(c => c.id));
                    comments.filter(c => c.reply_to_id).forEach(c => {
                        // Если родитель существует — вложенный, иначе показываем как root
                        if (commentIds.has(c.reply_to_id)) {
                            if (!repliesMap[c.reply_to_id]) repliesMap[c.reply_to_id] = [];
                            repliesMap[c.reply_to_id].push(c);
                        } else {
                            roots.push(c); // Родитель удалён — показываем как обычный
                        }
                    });
                    // Сортируем roots по времени
                    roots.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

                    function renderComment(c, isReply) {
                        const u = userMap[c.user_login] || { login: c.user_login, username: c.username, avatar_url: null };
                        const t = new Date(c.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                        const likeCount = commentLikesMap[c.id] || 0;
                        const iLiked = myCommentLikes.has(c.id);
                        const replies = repliesMap[c.id] || [];
                        const nestedHtml = replies.map(r => renderComment(r, true)).join('');
                        const hasReplies = replies.length > 0;
                        const repliesId = `replies-${c.id}`;

                        const isOwnComment = currentUser && c.user_login === currentUser.login;
                        const likeBtn = currentUser && !isOwnComment
                            ? `<button id="cl-btn-${c.id}" onclick="toggleCommentLike('${c.id}','${postId}')"
                                class="cl-like-btn${iLiked ? ' liked' : ''}"
                                style="background:none;border:none;font-size:13px;cursor:pointer;padding:2px 6px;font-family:inherit;display:inline-flex;align-items:center;gap:3px;border-radius:10px;color:${iLiked ? 'var(--pink)' : 'var(--text2)'};"
                               >❤️ <span id="cl-${c.id}" style="font-size:11px;">${likeCount > 0 ? likeCount : ''}</span></button>`
                            : likeCount > 0 ? `<span style="font-size:11px;color:var(--text2);display:inline-flex;align-items:center;gap:3px;">❤️ <span>${likeCount}</span></span>` : '';
                        const replyBtn = currentUser
                            ? `<button onclick="setReplyTarget('${postId}','${c.id}','${c.username.replace(/'/g,"\\'")}')
                                " style="background:none;border:none;color:var(--text2);font-size:11px;cursor:pointer;padding:0;font-family:inherit;margin-left:8px;">↩ Ответить</button>` : '';
                        const showRepliesBtn = hasReplies && !isReply
                            ? `<button onclick="toggleReplies('${repliesId}',this)" style="background:none;border:none;color:var(--blue);font-size:11px;cursor:pointer;padding:0;font-family:inherit;margin-left:8px;">▼ ${replies.length} ${replies.length === 1 ? 'ответ' : replies.length < 5 ? 'ответа' : 'ответов'}</button>` : '';

                        return `<div style="display:flex;align-items:flex-start;gap:7px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);${isReply ? 'padding-left:28px;border-left:2px solid rgba(77,201,246,0.25);margin-left:14px;padding-top:5px;' : ''}">
                            <div onclick="goProfile('${c.user_login}')" style="cursor:pointer;flex-shrink:0;">${buildAvatarHtml(u, isReply ? 22 : 26, isReply ? 9 : 11)}</div>
                            <div style="flex:1;min-width:0;">
                                <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
                                    <span style="font-weight:600;font-size:12px;cursor:pointer;color:var(--text);" onclick="goProfile('${c.user_login}')">${esc(c.username)}</span>
                                    ${c.reply_to_username ? `<span style="font-size:11px;color:var(--blue);background:rgba(77,201,246,0.1);padding:1px 6px;border-radius:6px;">↩ @${esc(c.reply_to_username)}</span>` : ''}
                                    <span style="font-size:10px;color:var(--text2);">${t}</span>
                                </div>
                                ${c.audio_url ? `<div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
                                    <audio controls src="${c.audio_url}" style="flex:1;min-width:0;height:32px;border-radius:20px;" preload="metadata"></audio>
                                    ${(currentUser && (c.user_login === currentUser.login || DEVS.includes(currentUser.login?.toLowerCase()))) ? `<button onclick="deleteComment('${c.id}','${postId}',${!!c.audio_url})" style="background:rgba(255,71,87,0.15);border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:3px 8px;font-size:11px;cursor:pointer;flex-shrink:0;" title="Удалить">🗑️</button>` : ''}
                                </div>` : ''}
                                ${c.text ? `<div style="font-size:12px;line-height:1.5;margin-top:3px;word-break:break-word;">${esc(c.text)}</div>` : ''}
                                <div style="display:flex;align-items:center;margin-top:4px;flex-wrap:wrap;gap:4px;">${likeBtn}${replyBtn}${showRepliesBtn}${(currentUser && !c.audio_url && (c.user_login === currentUser.login || DEVS.includes(currentUser.login?.toLowerCase()))) ? `<button onclick="deleteComment('${c.id}','${postId}',false)" style="background:none;border:none;color:var(--danger);font-size:11px;cursor:pointer;padding:0;font-family:inherit;margin-left:4px;opacity:0.7;" title="Удалить комментарий">🗑️</button>` : ''}</div>
                            </div>
                        </div>${hasReplies && !isReply ? `<div id="${repliesId}" style="display:none;">${nestedHtml}</div>` : (isReply ? nestedHtml : '')}`;
                    }
                    listEl.innerHTML = roots.map(c => renderComment(c, false)).join('');
                }
            }

            // Поле ввода
            if (currentUser) {
                const existingWrap = document.getElementById('ci-wrap-' + postId);
                if (existingWrap && !existingWrap.innerHTML.trim()) {
                    // Пустой контейнер (из buildPostCard) — заполняем
                    existingWrap.innerHTML = buildCommentInput(postId);
                } else if (!existingWrap) {
                    // Контейнера нет совсем (старый путь) — создаём
                    const inputDiv = document.createElement('div');
                    inputDiv.id = 'ci-wrap-' + postId;
                    inputDiv.style.cssText = 'margin-top:6px;';
                    inputDiv.innerHTML = buildCommentInput(postId);
                    box.appendChild(inputDiv);
                }
            }
        }

        function buildCommentInput(postId, replyToId, replyToUsername) {
            const placeholder = replyToUsername ? 'Ответить @' + replyToUsername + '...' : 'Написать комментарий...';
            const replyTag = replyToId
                ? `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;color:var(--blue);padding:4px 10px;background:rgba(77,201,246,0.08);border-radius:8px;">
                    ↩ Ответ для <strong>@${esc(replyToUsername)}</strong>
                    <span onclick="clearReplyTarget('${postId}')" style="cursor:pointer;color:var(--text2);margin-left:auto;font-size:13px;font-weight:700;">✕</span>
                   </div>` : '';
            return replyTag + `<div style="display:flex;align-items:center;gap:5px;">
                <input id="ci-${postId}" placeholder="${placeholder}"
                    data-reply-id="${replyToId || ''}" data-reply-name="${replyToUsername || ''}"
                    style="flex:1;background:var(--surface2);border:1px solid ${replyToId ? 'var(--blue)' : 'var(--border)'};border-radius:15px;padding:6px 12px;color:var(--text);font-size:12px;font-family:inherit;transition:border-color 0.2s;"
                    onkeydown="if(event.key==='Enter')addComment('${postId}')">
                <button id="voice-btn-${postId}" onclick="toggleVoiceRecording({postId:'${postId}'})"
                    style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:5px 9px;font-size:15px;cursor:pointer;flex-shrink:0;transition:all 0.2s;"
                    title="Голосовой комментарий">🎤</button>
                <button class="btn btn-outline btn-sm" onclick="addComment('${postId}')">→</button>
            </div>`;
        }

        function setReplyTarget(postId, commentId, username) {
            if (!currentUser) return toast('Войдите!', true);
            const wrap = document.getElementById('ci-wrap-' + postId);
            if (!wrap) return;
            wrap.innerHTML = buildCommentInput(postId, commentId, username);
            const input = document.getElementById('ci-' + postId);
            if (input) { input.focus(); input.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
        }

        function clearReplyTarget(postId) {
            const wrap = document.getElementById('ci-wrap-' + postId);
            if (wrap) wrap.innerHTML = buildCommentInput(postId);
        }

        function toggleReplies(id, btn) {
            const el = document.getElementById(id);
            if (!el) return;
            const isOpen = el.style.display !== 'none';
            el.style.display = isOpen ? 'none' : 'block';
            if (btn) btn.innerHTML = btn.innerHTML.replace(isOpen ? '▲' : '▼', isOpen ? '▼' : '▲');
        }

        // Блокировка от двойного нажатия на лайк комментария
        const _commentLikeLock = new Set();

        async function toggleCommentLike(commentId, postId) {
            if (!currentUser) return toast('Войдите!', true);
            // Защита от само-лайка
            const { data: commentData } = await SB.from('comments').select('user_login').eq('id', commentId).single();
            if (commentData && commentData.user_login === currentUser.login) return toast('Нельзя лайкать свои комментарии 😅', true);
            // Защита от двойного нажатия
            const lockKey = commentId + '_' + currentUser.login;
            if (_commentLikeLock.has(lockKey)) return;
            _commentLikeLock.add(lockKey);
            const btn = document.getElementById('cl-btn-' + commentId);
            const countEl = document.getElementById('cl-' + commentId);
            try {
                // Выбираем ВСЕ лайки этого юзера на этот комментарий (на случай дублей)
                const { data: allExist } = await SB.from('comment_likes')
                    .select('*').eq('comment_id', commentId).eq('user_login', currentUser.login);
                if (allExist && allExist.length > 0) {
                    // Удаляем все (заодно чистим старые дубли)
                    await SB.from('comment_likes').delete()
                        .eq('comment_id', commentId).eq('user_login', currentUser.login);
                    if (btn) { btn.style.color = 'var(--text2)'; btn.classList.remove('liked'); }
                    if (countEl) { const n = parseInt(countEl.textContent || '0') - 1; countEl.textContent = n > 0 ? n : ''; }
                } else {
                    await SB.from('comment_likes').insert([{ comment_id: parseInt(commentId), user_login: currentUser.login }]);
                    if (btn) {
                        btn.style.color = 'var(--pink)';
                        btn.classList.add('liked');
                        btn.style.animation = 'none';
                        btn.offsetHeight; // reflow
                        btn.style.animation = 'likepop 0.35s ease';
                    }
                    if (countEl) { const n = parseInt(countEl.textContent || '0') + 1; countEl.textContent = n; }
                    const { data: com } = await SB.from('comments').select('user_login, text').eq('id', commentId).single();
                    if (com && com.user_login !== currentUser.login) {
                        const preview = (com.text || '').substring(0, 40);
                        await SB.from('notifications').insert([{
                            user_login: com.user_login, type: 'like',
                            text: `❤️ ${currentUser.username} лайкнул(а) твой комментарий: "${preview}${(com.text||'').length > 40 ? '...' : ''}"`,
                            from_login: currentUser?.login || null, is_read: false
                        }]);
                    }
                }
            } finally {
                _commentLikeLock.delete(lockKey);
            }
        }
        async function renderMessages() {
            const mc = document.getElementById('mainContainer');
            const { data: sent } = await SB.from('messages').select('*').eq('sender_login', currentUser.login).order('created_at', { ascending: false });
            const { data: received } = await SB.from('messages').select('*').eq('receiver_login', currentUser.login).order('created_at', { ascending: false });
            const dialogs = {};
            [...(sent || []), ...(received || [])].forEach(msg => {
                const partner = msg.sender_login === currentUser.login ? msg.receiver_login : msg.sender_login;
                const partnerName = msg.sender_login === currentUser.login ? msg.receiver_username : msg.sender_username;
                if (!dialogs[partner] || new Date(msg.created_at) > new Date(dialogs[partner].time)) {
                    dialogs[partner] = { login: partner, username: partnerName, lastText: msg.text, time: msg.created_at };
                }
            });
            let html = '<h3 style="margin-bottom:14px;">💬 Личные сообщения</h3>';
            const list = Object.values(dialogs).sort((a, b) => new Date(b.time) - new Date(a.time));
            if (list.length === 0) {
                html += '<div class="card" style="text-align:center;color:var(--text2);">Нет сообщений</div>';
            } else {
                // Загружаем данные пользователей для аватаров
                const logins = list.map(d => d.login);
                const { data: usersData } = await SB.from('users').select('login, username, avatar_url, avatar_frame').in('login', logins);
                const userMap = {};
                (usersData || []).forEach(u => {
                    // Подставляем avatar из localStorage если нет в БД
                    if (!u.avatar_url) {
                        const avatarMap = JSON.parse(localStorage.getItem('niji_avatars') || '{}');
                        if (avatarMap[u.login]) u.avatar_url = avatarMap[u.login];
                    }
                    userMap[u.login] = u;
                });
                list.forEach(d => {
                    const t = new Date(d.time).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                    const uObj = userMap[d.login] || { login: d.login, username: d.username, avatar_url: null };
                    html += `
                    <div class="dialog-row" onclick="openChat('${d.login}','${esc(d.username)}')">
                        <div onclick="event.stopPropagation(); goProfile('${d.login}')" style="cursor:pointer;flex-shrink:0;" title="Профиль">
                            ${buildAvatarHtml(uObj, 44, 18)}
                        </div>
                        <div class="dialog-info">
                            <div class="dialog-name" onclick="event.stopPropagation(); goProfile('${d.login}')" style="cursor:pointer;" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color=''">${esc(d.username)}</div>
                            <div class="dialog-last">${esc(d.lastText.substring(0, 40))}${d.lastText.length > 40 ? '...' : ''}</div>
                        </div>
                        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                            <div class="dialog-time">${t}</div>
                            <button onclick="event.stopPropagation(); goProfile('${d.login}')" style="background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:inherit;">👤 Профиль</button>
                        </div>
                    </div>`;
                });
            }
            html += '<div class="card" style="text-align:center;"><button class="btn btn-outline" onclick="showUserList()">✉️ Написать пользователю</button></div>';
            mc.innerHTML = html;
        }
        async function showUserList() {
            const { data: users } = await SB.from('users').select('*').order('username');
            const mc = document.getElementById('mainContainer');
            let html = '<button class="btn-back" onclick="goMessages()">← Назад</button><h3 style="margin:12px 0;">👥 Выбери кому написать</h3>';
            users.forEach(u => {
                if (u.login === currentUser.login) return;
                // Подставляем аватар из localStorage если нет в БД
                if (!u.avatar_url) {
                    const avatarMap = JSON.parse(localStorage.getItem('niji_avatars') || '{}');
                    if (avatarMap[u.login]) u.avatar_url = avatarMap[u.login];
                }
                html += `
                <div class="dialog-row" onclick="openChat('${u.login}','${esc(u.username)}')">
                    ${buildAvatarHtml(u, 44, 18)}
                    <div class="dialog-info"><div class="dialog-name">${esc(u.username)}</div></div>
                    <button class="btn-msg">💬</button>
                </div>`;
            });
            mc.innerHTML = html;
        }
        function openChat(login, username) {
            chatWith = { login, username };
            document.getElementById('chatModal').style.display = 'flex';
            renderChatMessages();
            if (chatInterval) clearInterval(chatInterval);
            chatInterval = setInterval(renderChatMessages, 3000);
        }
        async function renderChatMessages() {
            if (!chatWith) return;
            const el = document.getElementById('chatContent');
            const { data: messages } = await SB.from('messages').select('*')
                .or(`and(sender_login.eq.${currentUser.login},receiver_login.eq.${chatWith.login}),and(sender_login.eq.${chatWith.login},receiver_login.eq.${currentUser.login})`)
                .order('created_at', { ascending: true });

            // Загружаем аватар собеседника
            let partnerObj = { login: chatWith.login, username: chatWith.username, avatar_url: null };
            const { data: partnerData } = await SB.from('users').select('login, username, avatar_url, avatar_frame').eq('login', chatWith.login).single();
            if (partnerData) {
                if (!partnerData.avatar_url) {
                    const avatarMap = JSON.parse(localStorage.getItem('niji_avatars') || '{}');
                    if (avatarMap[chatWith.login]) partnerData.avatar_url = avatarMap[chatWith.login];
                }
                partnerObj = partnerData;
            }

            // Запоминаем позицию скролла (если окно уже открыто и не внизу — не прыгаем)
            const existingMsgs = document.getElementById('chatMessages');
            const wasAtBottom = !existingMsgs || (existingMsgs.scrollHeight - existingMsgs.scrollTop - existingMsgs.clientHeight < 60);
            const prevScrollTop = existingMsgs ? existingMsgs.scrollTop : null;

            // Строим сообщения отдельно
            let msgsHtml = '';
            if (!messages || messages.length === 0) {
                msgsHtml = '<div style="text-align:center;color:var(--text2);padding:40px 20px;">Напиши первое сообщение! 👋</div>';
            } else {
                messages.forEach(msg => {
                    const isMine = msg.sender_login === currentUser.login;
                    const t = new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    let deleteBtn = '';
                    if (isMine) {
                        deleteBtn = `<span style="margin-left:8px; cursor:pointer; font-size:11px; opacity:0.6;" onclick="deleteMessage(${msg.id}, event)">🗑️</span>`;
                    }
                    msgsHtml += `<div class="msg-bubble ${isMine ? 'msg-sent' : 'msg-received'}">
                        ${msg.image_url ? `<img src="${msg.image_url}" style="max-width:100%;max-height:400px;border-radius:10px;display:block;margin-bottom:${msg.text ? '6px' : '0'};object-fit:contain;cursor:pointer;" onclick="this.style.maxHeight=this.style.maxHeight==='none'?'400px':'none'" onerror="this.style.display='none'">` : ''}
                        ${msg.audio_url ? `<audio controls src="${msg.audio_url}" style="max-width:100%;border-radius:8px;"></audio>` : ''}
                        ${msg.text ? esc(msg.text) : ''}
                        <div style="font-size:9px; opacity:0.6; margin-top:4px; display:flex; align-items:center; justify-content:space-between;">
                            <span>${t}</span>
                            ${deleteBtn}
                        </div>
                    </div>`;
                });
            }

            // Если чат уже отрисован — добавляем только НОВЫЕ сообщения
            const existingContainer = document.getElementById('chatMessages');
            if (existingContainer) {
                // Считаем сколько реальных сообщений уже показано (без temp-)
                const existingReal = existingContainer.querySelectorAll('.msg-bubble:not([id^="temp_"])').length;
                const totalReal = (messages || []).length;

            // Первый рендер — строим всю структуру

                </div>
                <h3 onclick="closeChat(); goProfile('${chatWith.login}')" style="margin:0; flex:1; font-size:15px; cursor:pointer; transition:color 0.2s;" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color=''">💬 ${esc(chatWith.username)}</h3>
                <button onclick="closeChat()" style="background:none; border:none; color:var(--text2); cursor:pointer; font-size:20px; padding:4px 8px; border-radius:8px;" title="Закрыть">✕</button>
            </div>
            <div id="chatMessages" style="flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:2px; scroll-behavior:smooth;">
                ${msgsHtml}
            </div>
            <div style="flex-shrink:0; border-top:1px solid var(--border); background:var(--surface); padding:8px 12px;">
                <!-- Превью фото перед отправкой -->
                <div id="chatPhotoPreview" style="display:none; padding:4px 0 8px; position:relative;">
                    <img id="chatPhotoPreviewImg" style="max-width:100%; max-height:200px; border-radius:10px; border:2px solid var(--pink); display:block; object-fit:contain;">
                    <span onclick="clearChatPhoto()" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.7);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:700;">✕</span>
                </div>
                <!-- Эмодзи -->
                <div style="display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px;">
                    <span class="emoji-btn" onclick="insertEmoji('😊')">😊</span>
                    <span class="emoji-btn" onclick="insertEmoji('😂')">😂</span>
                    <span class="emoji-btn" onclick="insertEmoji('❤️')">❤️</span>
                    <span class="emoji-btn" onclick="insertEmoji('👍')">👍</span>
                    <span class="emoji-btn" onclick="insertEmoji('🔥')">🔥</span>
                    <span class="emoji-btn" onclick="insertEmoji('💎')">💎</span>
                    <span class="emoji-btn" onclick="insertEmoji('✨')">✨</span>
                    <span class="emoji-btn" onclick="insertEmoji('🥺')">🥺</span>
                </div>
                <!-- Поле ввода -->
                <div class="msg-input-area" style="margin:0; position:static;">
                    <input id="chatInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendMessage()">
                    <label style="cursor:pointer; display:flex; align-items:center; justify-content:center; min-width:38px; height:38px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; font-size:16px;" title="Отправить фото">
                        📷
                        <input type="file" accept="image/*" style="display:none;" onchange="previewChatPhoto(this)">
                    </label>
                    <button id="voiceBtn" class="btn btn-outline btn-sm" onclick="toggleVoiceRecording('chat')" style="padding:8px 12px; min-width:42px; font-size:16px;">🎤</button>
                    <button class="btn btn-pink btn-sm" onclick="sendMessage()">→</button>

            el.innerHTML = html;
            setTimeout(() => {
                const container = document.getElementById('chatMessages');
                if (container) container.scrollTop = container.scrollHeight;

        }
        function insertEmoji(emoji) {
            const input = document.getElementById('chatInput');
            if (!input) return;
            input.value = input.value + emoji;
            input.focus();
        }

        let chatPhotoData = null;
        let chatPhotoFile = null;

        function previewChatPhoto(input) {
            const file = input.files[0];
            if (!file || !file.type.startsWith('image/')) return toast('Только изображения!', true);
            chatPhotoFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                chatPhotoData = e.target.result;
                const wrap = document.getElementById('chatPhotoPreview');
                const img = document.getElementById('chatPhotoPreviewImg');
                if (wrap && img) { img.src = e.target.result; wrap.style.display = 'block'; }
            };
            reader.readAsDataURL(file);
        }

        function clearChatPhoto() {
            chatPhotoData = null;
            chatPhotoFile = null;
            const wrap = document.getElementById('chatPhotoPreview');
            if (wrap) wrap.style.display = 'none';
        }

        async function deleteMessage(messageId, e) {
            e.stopImmediatePropagation();
            if (!confirm('Удалить это сообщение?')) return;

            const { error } = await SB.from('messages').delete().eq('id', messageId);
            if (error) return toast('Ошибка удаления сообщения: ' + error.message, true);

            toast('Сообщение удалено');
            await renderChatMessages();
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            if (!input || !chatWith) return;
            const text = input.value.trim();
            if (!text && !chatPhotoData) return;

            // Захватываем данные и сразу очищаем UI
            const localPhotoSrc = chatPhotoData;
            const msgText = text;
            input.value = '';
            chatPhotoData = null;
            chatPhotoFile = null;
            const wrap = document.getElementById('chatPhotoPreview');
            if (wrap) wrap.style.display = 'none';

            // Показываем сообщение мгновенно (оптимистично)
            const tempId = 'temp_' + Date.now();
            const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const container = document.getElementById('chatMessages');
            if (container) {
                const div = document.createElement('div');
                div.className = 'msg-bubble msg-sent';
                div.id = tempId;
                div.innerHTML = `
                    ${localPhotoSrc ? `<img src="${localPhotoSrc}" style="max-width:100%;max-height:400px;border-radius:10px;display:block;margin-bottom:${msgText?'6px':'0'};object-fit:contain;cursor:pointer;" onclick="this.style.maxHeight=this.style.maxHeight==='none'?'400px':'none'">` : ''}
                    ${msgText ? esc(msgText) : ''}
                    <div id="${tempId}-status" style="font-size:9px;opacity:0.5;margin-top:4px;">${t} ⏳</div>`;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }

            // Загружаем фото в Storage если есть
            let imageUrl = null;
            if (localPhotoSrc) {
                try {
                    // Сжимаем только если фото очень большое (>4000px), иначе оставляем как есть
                    const img = new Image();
                    await new Promise(r => { img.onload = r; img.src = localPhotoSrc; });
                    const needsResize = img.width > 4000 || img.height > 4000;
                    const compressed = needsResize
                        ? await compressImage(localPhotoSrc, 3000, 0.92)
                        : localPhotoSrc;

                    const res = await fetch(compressed);
                    const blob = await res.blob();
                    const safeLogin = currentUser.login.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_.-]/g,'');
                    const ext = blob.type.includes('png') ? 'png' : 'jpg';
                    const fileName = `chat/${safeLogin}_${Date.now()}.${ext}`;
                    const { data: upData, error: upErr } = await SB.storage.from('post-images').upload(fileName, blob, { contentType: blob.type, upsert: false });
                    if (!upErr) {
                        const { data: urlData } = SB.storage.from('post-images').getPublicUrl(fileName);
                        imageUrl = urlData.publicUrl;
                    } else {
                        // Если Storage недоступен — сохраняем ужатый base64 (≤200KB)
                        const fallback = await compressImage(localPhotoSrc, 1200, 0.75);
                        imageUrl = fallback;
                        console.warn('Storage недоступен, используем base64 fallback:', upErr.message);
                    }
                } catch(e) {
                    console.warn('Фото не загружено:', e);
                    // Последний шанс — сжать покомпактнее и отправить как base64
                    try {
                        imageUrl = await compressImage(localPhotoSrc, 800, 0.7);
                    } catch(e2) { /* совсем не повезло */ }
                }
            }

            // Сохраняем в БД
            let insertData = {
                sender_login: currentUser.login,
                sender_username: currentUser.username,
                receiver_login: chatWith.login,
                receiver_username: chatWith.username,
                text: msgText || '',
                image_url: imageUrl || null
            };
            let { error } = await SB.from('messages').insert([insertData]);

            // Если колонки image_url нет — шлём без неё, но temp-пузырь с фото НЕ трогаем
            if (error && error.message && error.message.includes('image_url')) {
                const tempEl = document.getElementById(tempId);
                if (tempEl) tempEl.setAttribute('data-photo-only', 'true');
                delete insertData.image_url;
                ({ error } = await SB.from('messages').insert([insertData]));
                if (!error) toast('⚠️ Фото видно только тебе — добавь колонку image_url в messages в Supabase', true);
            }

            // Если сообщение слишком большое (base64 не влез в БД) — пробуем сжать сильнее
            if (error && imageUrl && imageUrl.startsWith('data:') && (error.message.includes('too large') || error.message.includes('value too long') || error.message.includes('size'))) {
                try {
                    const moreCompressed = await compressImage(localPhotoSrc || imageUrl, 600, 0.65);
                    insertData.image_url = moreCompressed;
                    ({ error } = await SB.from('messages').insert([insertData]));
                } catch(e2) { /* игнорируем */ }
            }

            if (error) {
                // Помечаем ошибку прямо на пузыре — не удаляем его
                const statusEl = document.getElementById(tempId + '-status');
                if (statusEl) statusEl.innerHTML = `<span style="color:#ff4757;">❌ Не отправлено</span>`;
                toast('❌ Ошибка: ' + error.message, true);
                return;
            }

            // Убираем ⏳, оставляем пузырь как есть — перерисовка НЕ нужна
            const statusEl = document.getElementById(tempId + '-status');
            if (statusEl) statusEl.innerHTML = `${t} ✓`;

            // Уведомление получателю
            const msgPreview = msgText ? msgText.substring(0, 50) + (msgText.length > 50 ? '...' : '') : '📷 фото';
            await SB.from('notifications').insert([{
                user_login: chatWith.login,
                type: 'message',
                text: `✉️ ${currentUser.username} написал(а) тебе: "${msgPreview}"`,
                from_login: currentUser?.login || null, is_read: false
            }]);
        }
        function closeChat() {
            document.getElementById('chatModal').style.display = 'none';
            if (chatInterval) clearInterval(chatInterval);
            chatWith = null;
        }

        // === Голосовые сообщения ===

        // Запуск/остановка записи. ctx = 'chat' | { postId: '...' }
        async function toggleVoiceRecording(ctx) {
            if (!currentUser) return toast('Войдите!', true);
            const btnId = ctx === 'chat' ? 'voiceBtn' : 'voice-btn-' + ctx.postId;
            const btn = document.getElementById(btnId);

            if (isRecording) {
                // Останавливаем
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(t => t.stop());
                }
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                // Выбираем поддерживаемый формат
                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                    ? 'audio/webm;codecs=opus'
                    : MediaRecorder.isTypeSupported('audio/webm')
                    ? 'audio/webm'
                    : MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')
                    ? 'audio/ogg;codecs=opus'
                    : 'audio/mp4';

                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];
                voiceContext = ctx;

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

                mediaRecorder.onstop = async () => {
                    isRecording = false;
                    if (btn) { btn.style.background = ''; btn.innerHTML = '🎤'; }
                    await finishVoiceRecording();
                };

                mediaRecorder.start(100); // timeslice 100ms — получаем данные чаще
                isRecording = true;
                if (btn) { btn.style.background = '#ff4757'; btn.innerHTML = '⏹️'; }

                // Показываем таймер записи
                let sec = 0;
                const timer = setInterval(() => {
                    sec++;
                    if (btn) btn.innerHTML = `⏹️ ${sec}s`;
                    if (sec >= 120) { // макс 2 минуты
                        clearInterval(timer);
                        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                            mediaRecorder.stop();
                            mediaRecorder.stream.getTracks().forEach(t => t.stop());
                        }
                    }
                    if (!isRecording) clearInterval(timer);
                }, 1000);

                toast('🎙️ Запись... нажми ещё раз чтобы остановить');
            } catch(err) {
                console.error(err);
                if (err.name === 'NotAllowedError') {
                    toast('❌ Нет доступа к микрофону — разреши его в браузере', true);
                } else {
                    toast('❌ Не удалось начать запись: ' + err.message, true);
                }
            }
        }

        async function finishVoiceRecording() {
            if (!audioChunks.length) return;
            const mimeType = mediaRecorder?.mimeType || 'audio/webm';
            const ext = mimeType.includes('ogg') ? 'ogg' : mimeType.includes('mp4') ? 'mp4' : 'webm';
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            audioChunks = [];

            toast('⏳ Сохраняю голосовое...');

            // Пробуем загрузить в Storage
            let audioUrl = null;
            const safeLogin = currentUser.login.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_.-]/g,'');
            const fileName = `voice/${safeLogin}_${Date.now()}.${ext}`;

            try {
                const { error: upErr } = await SB.storage.from('post-images').upload(fileName, audioBlob, {
                    contentType: mimeType, upsert: false
                });
                if (!upErr) {
                    const { data: urlData } = SB.storage.from('post-images').getPublicUrl(fileName);
                    audioUrl = urlData.publicUrl;
                } else {
                    // Storage недоступен — конвертируем в base64
                    audioUrl = await blobToBase64(audioBlob);
                }
            } catch(e) {
                audioUrl = await blobToBase64(audioBlob);
            }

            if (!audioUrl) return toast('❌ Не удалось сохранить запись', true);

            if (voiceContext === 'chat') {
                // Отправка в чат
                if (!chatWith) return;
                const { error: voiceErr } = await SB.from('messages').insert([{
                    sender_login: currentUser.login,
                    sender_username: currentUser.username,
                    receiver_login: chatWith.login,
                    receiver_username: chatWith.username,
                    text: '',
                    audio_url: audioUrl
                }]);
                if (voiceErr) {
                    toast('❌ Ошибка отправки: ' + voiceErr.message, true);
                } else {
                    // Показываем голосовое мгновенно в чате
                    const container = document.getElementById('chatMessages');
                    if (container) {
                        const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                        const div = document.createElement('div');
                        div.className = 'msg-bubble msg-sent';
                        div.innerHTML = `<audio controls src="${audioUrl}" style="max-width:100%;border-radius:8px;"></audio>
                            <div style="font-size:9px;opacity:0.6;margin-top:4px;">${t} ✓</div>`;
                        container.appendChild(div);
                        container.scrollTop = container.scrollHeight;
                    }
                    toast('✅ Голосовое отправлено!');
                    // Уведомление получателю
                    await SB.from('notifications').insert([{
                        user_login: chatWith.login,
                        type: 'message',
                        text: `🎙️ ${currentUser.username} отправил(а) тебе голосовое сообщение`,
                        from_login: currentUser?.login || null, is_read: false
                    }]);
                }
            } else if (voiceContext?.postId) {
                // Отправка в комментарий
                const postId = voiceContext.postId;
                const replyInput = document.getElementById('ci-' + postId);
                const replyToId = replyInput?.dataset.replyId ? parseInt(replyInput.dataset.replyId) : null;
                const replyToUsername = replyInput?.dataset.replyName || null;

                const commentData = {
                    post_id: parseInt(postId),
                    user_login: currentUser.login,
                    username: currentUser.username,
                    text: '',
                    audio_url: audioUrl
                };
                if (replyToId) {
                    commentData.reply_to_id = replyToId;
                    commentData.reply_to_username = replyToUsername;
                }

                const { error: comErr } = await SB.from('comments').insert([commentData]);
                if (comErr) {
                    toast('❌ Ошибка: ' + comErr.message, true);
                } else {
                    // Уведомление автору поста
                    const { data: postData } = await SB.from('posts').select('user_login').eq('id', postId).single();
                    if (postData && postData.user_login !== currentUser.login) {
                        await SB.from('notifications').insert([{
                            user_login: postData.user_login, type: 'comment',
                            text: `🎙️ ${currentUser.username} оставил(а) голосовой комментарий [post_id:${postId}]`,
                            from_login: currentUser?.login || null, is_read: false
                        }]);
                    }
                    // Уведомление тому на кого ответили
                    if (replyToId && replyToUsername) {
                        const { data: repliedCom } = await SB.from('comments').select('user_login').eq('id', replyToId).single();
                        if (repliedCom && repliedCom.user_login !== currentUser.login) {
                            await SB.from('notifications').insert([{
                                user_login: repliedCom.user_login, type: 'comment',
                                text: `🎙️ ${currentUser.username} ответил(а) тебе голосовым [post_id:${postId}]`,
                                from_login: currentUser?.login || null, is_read: false
                            }]);
                        }
                    }
                    // Сбрасываем режим ответа и перезагружаем комментарии
                    clearReplyTarget(postId);
                    await loadPostStats(postId);
                    toast('✅ Голосовой комментарий отправлен!');
                }
            }
            voiceContext = null;
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function renderPeople() {
            const mc = document.getElementById('mainContainer');
            
            let users, error;
            ({ data: users, error } = await SB.from('users')
                .select('login, username, registered, last_seen, is_verified, level, reputation, avatar_url')
                .order('last_seen', { ascending: false }));

            if (error && error.message && error.message.includes('avatar_url')) {
                ({ data: users, error } = await SB.from('users')
                    .select('login, username, registered, last_seen, is_verified, level, reputation')
                    .order('last_seen', { ascending: false }));
                if (users) users.forEach(u => u.avatar_url = null);
            }

            if (error) {
                mc.innerHTML = `<div class="card" style="color:var(--danger);">Ошибка: ${error.message}</div>`;
                return;
            }

            const now = Date.now();
            const threeMin = 3 * 60 * 1000;
            const onlineList = (users || []).filter(u => u.last_seen && (now - new Date(u.last_seen).getTime()) < threeMin);

            let html = `
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
                    <h3 style="margin:0;">👥 Все пользователи</h3>
                    <span style="font-size:12px; color:var(--text2);">
                        🟢 <strong style="color:#2ed573;">${onlineList.length}</strong> онлайн из <strong style="color:#fff;">${(users||[]).length}</strong>
                    </span>
                </div>`;

            if (!users || users.length === 0) {
                html += '<div class="card" style="text-align:center;color:var(--text2);">Пока нет пользователей</div>';
            } else {
                users.forEach(u => {
                    if (!u.avatar_url) u.avatar_url = null;
                    const isOnline = u.last_seen && (now - new Date(u.last_seen).getTime()) < threeMin;
                    const regDate = new Date(u.registered).toLocaleString('ru-RU', {
                        day: 'numeric', month: 'short', year: 'numeric'
                    });

                    let lastSeenText;
                    if (!u.last_seen) {
                        lastSeenText = 'не заходил';
                    } else if (isOnline) {
                        lastSeenText = 'сейчас онлайн';
                    } else {
                        const diff = now - new Date(u.last_seen).getTime();
                        const mins = Math.floor(diff / 60000);
                        const hours = Math.floor(diff / 3600000);
                        const days = Math.floor(diff / 86400000);
                        if (mins < 60) lastSeenText = `${mins} мин. назад`;
                        else if (hours < 24) lastSeenText = `${hours} ч. назад`;
                        else lastSeenText = `${days} дн. назад`;
                    }

                    html += `

        // === Загрузка картинки в Supabase Storage (bucket "post-images") ===

        function handlePostPhotoFile(inputId) {
            const fileInput = document.getElementById(inputId + '-file');
            if (!fileInput || !fileInput.files.length) return;
            const file = fileInput.files[0];
            if (!file.type.startsWith('image/')) { toast('Только изображения!', true); return; }
            const reader = new FileReader();
            reader.onload = e => {
                const box = document.getElementById(inputId + '-preview');
                const img = document.getElementById(inputId + '-preview-img');
                const frameRow = document.getElementById(inputId + '-frame-row');
                if (box && img) { img.src = e.target.result; box.style.display = 'block'; }
                if (frameRow) frameRow.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function showStorageFixModal() {
            const existing = document.getElementById('storageFixModal');
            if (existing) return;
            const m = document.createElement('div');
            m.id = 'storageFixModal';
            m.className = 'modal-overlay';
            m.style.cssText = 'z-index:9998;';
            m.innerHTML = `
