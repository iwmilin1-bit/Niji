<!DOCTYPE html>
<html lang="ru">ш
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>にじ Niji</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--pink:#ff6b9d;--blue:#4dc9f6;--green:#2ed573;--text:#e0e0e0;--text2:#8888aa;--border:#252535;--danger:#ff4757}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .logo{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;transition:transform 0.2s ease}
        .logo:hover{transform:scale(1.05)}
        .header-right{display:flex;gap:10px;align-items:center}
        .btn{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all 0.2s ease}
        .btn-pink{background:var(--pink);color:#fff}
        .btn-pink:hover{background:#ff85b0;transform:scale(1.03)}
        .btn-outline{background:transparent;border:1px solid var(--blue);color:var(--blue)}
        .btn-sm{padding:5px 12px;font-size:11px}
        .btn-back{background:var(--surface2);color:var(--text);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);font-family:inherit}
        .btn-msg{background:var(--blue);color:#000;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
        .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;transition:transform 0.2s ease, box-shadow 0.2s ease}
        .avatar:hover{transform:scale(1.1);box-shadow:0 0 0 3px rgba(255,107,157,0.2)}
        .avatar-lg{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content-center;color:#fff;font-weight:700;font-size:28px;margin:0 auto}
        .dropdown{position:absolute;top:40px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;min-width:150px;display:none;z-index:200}
        .dropdown.show{display:block}
        .dropdown button{display:block;width:100%;background:none;border:none;color:var(--text);padding:8px 14px;cursor:pointer;font-size:13px;text-align:left;border-radius:8px;font-family:inherit}
        .dropdown button:hover{background:var(--surface2)}
        .user-badge{display:flex;align-items:center;gap:8px;cursor:pointer;position:relative}
        .notif-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 20px;font-size:11px;display:flex;justify-content:space-between}
        .nav-tabs{display:flex;gap:16px;margin-bottom:14px}
        .nav-tab{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;font-family:inherit;padding:4px 0;border-bottom:2px solid transparent;font-weight:500}
        .nav-tab.active{color:var(--text);border-bottom-color:var(--pink)}
        .container{max-width:650px;margin:16px auto;padding:0 16px}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;transition:all 0.2s ease;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
        .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.3);border-color:#3a3a4a}
        textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);font-family:inherit;font-size:13px;resize:vertical;min-height:50px;margin-bottom:8px}
        textarea:focus{outline:none;border-color:var(--blue)}
        .row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        .tag{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.2s ease}
        .tag:hover{background:#2a2a38;border-color:var(--blue);color:var(--text)}
        .post-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
        .post-name{font-weight:600;font-size:13px;cursor:pointer}
        .post-name:hover{color:var(--blue)}
        .post-time{font-size:11px;color:var(--text2)}
        .post-text{font-size:13px;line-height:1.5;margin:8px 0}
        .post-tag{display:inline-block;background:var(--surface2);padding:2px 8px;border-radius:8px;font-size:10px;color:var(--blue);margin-bottom:6px}
        .actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid var(--border)}
        .act{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit}
        .act:hover{color:var(--text)}
        .act.liked{color:var(--pink)}
        .comments-box{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
        .comments-box.open{display:block}
        .comment{font-size:12px;padding:3px 0}
        .comment-input{display:flex;gap:6px;margin-top:6px}
        .comment-input input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:15px;padding:6px 12px;color:var(--text);font-size:11px;font-family:inherit}
        .tabs{display:flex;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px}
        .tab{flex:1;background:none;border:none;color:var(--text2);padding:10px;cursor:pointer;font-size:13px;font-family:inherit;text-align:center}
        .tab.active{background:var(--pink);color:#fff;font-weight:600}
        .guest-row,.dialog-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:6px;cursor:pointer;transition:border-color 0.2s}
        .dialog-row:hover,.guest-row:hover{border-color:var(--blue)}
        .dialog-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
        .dialog-info{flex:1}
        .dialog-name{font-weight:600;font-size:14px}
        .dialog-last{font-size:12px;color:var(--text2);margin-top:2px}
        .dialog-time{font-size:10px;color:var(--text2)}
        .msg-bubble{max-width:80%;padding:10px 14px;border-radius:16px;margin:6px 0;font-size:13px;line-height:1.4}
        .msg-sent{background:var(--pink);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
        .msg-received{background:var(--surface2);color:var(--text);border-bottom-left-radius:4px}
        .msg-input-area{display:flex;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;position:sticky;bottom:0;margin-top:10px}
        .msg-input-area input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:13px}
        .msg-input-area input:focus{outline:none;border-color:var(--blue)}
        .emoji-btn {
            font-size: 18px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .emoji-btn:hover {
            background: #2a2a38;
        }
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;display:flex;align-items:center;justify-content:center}
        .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:400px;max-width:90vw;max-height:80vh;overflow-y:auto}
        .modal h2{font-size:18px;margin-bottom:12px}
        .modal input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);margin-bottom:8px;font-family:inherit}
        .modal .btn-full{width:100%;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border:none;background:var(--pink);color:#fff;margin-bottom:8px}
        .modal .btn-link{width:100%;background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;font-family:inherit;margin-top:4px}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue);color:#000;padding:10px 22px;border-radius:25px;font-weight:600;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.3s}
        .toast.show{opacity:1}
        .toast.error{background:var(--danger);color:#fff}

        /* Стили для картинок в постах */
        .post-image {
            max-width: 100%;
            max-height: 420px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: block;
            margin: 10px 0;
            object-fit: contain;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .post-image:hover {
            transform: scale(1.015);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* Галерея аватаров */
        .avatar-gallery-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin: 12px 0;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .avatar-gallery-grid::-webkit-scrollbar { width: 4px; }
        .avatar-gallery-grid::-webkit-scrollbar-track { background: var(--surface2); border-radius: 2px; }
        .avatar-gallery-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .avatar-option {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--surface2);
            overflow: hidden;
        }
        .avatar-option:hover { border-color: var(--blue); transform: scale(1.1); }
        .avatar-option.selected { border-color: var(--pink); box-shadow: 0 0 0 2px rgba(255,107,157,0.4); }
        .avatar-option img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .avatar-preview-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 3px solid var(--pink);
            background: var(--surface2);
            overflow: hidden;
        }
        .avatar-preview-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .avatar-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
        .avatar-tab { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 5px 12px; border-radius: 10px; font-size: 12px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
        .avatar-tab.active { background: var(--pink); border-color: var(--pink); color: #fff; }
    </style>
</head>
<body>
    <header class="header">
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="logo" onclick="goHome()">にじ Niji</div>
            <div onclick="showChangelog()" style="background:var(--surface2); color:var(--text2); font-size:11px; padding:2px 9px; border-radius:999px; cursor:pointer; border:1px solid var(--border); user-select:none;">
                v1.7
            </div>
        </div>
        <div class="header-right" id="headerRight"></div>
    </header>
    <div class="notif-bar">
        <span id="notifText">💬 Niji — личные сообщения</span>
    </div>

    <!-- Большая заметная статистика -->
    <div style="background:#12121a; border-bottom:1px solid #252535; padding:8px 0; text-align:center; font-size:14px; color:#ccc; min-height:22px;">
        <span id="bigStatsText" style="font-weight:600; letter-spacing:0.5px;">👥 Загрузка...</span>
    </div>
    <div class="container">
        <div class="nav-tabs" id="navTabs"></div>
        <div id="mainContainer"></div>
    </div>
    <div class="modal-overlay" id="authModal" style="display:none;">
        <div class="modal">
            <h2 id="authTitle">Вход</h2>
            <input type="text" id="authLogin" placeholder="Логин">
            <input type="password" id="authPassword" placeholder="Пароль">
            <button class="btn-full" id="authBtn" onclick="handleAuth()">Войти</button>
            <button class="btn-link" id="switchBtn" onclick="toggleAuth()">Регистрация</button>
            <button class="btn-link" onclick="closeAuth()" style="color:var(--text2);">Закрыть</button>
        </div>
    </div>
    <div class="modal-overlay" id="chatModal" style="display:none;">
        <div class="modal" id="chatContent"></div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const SB = supabase.createClient(
            'https://fzgjkkljxbphrcjtqgew.supabase.co',
            'sb_publishable_Ef2IM3grizwYR1gCkJR6Aw_iDbnFn9Q'
        );
        let currentUser = null;
        let isLogin = true;
        let page = 'feed';
        let profileLogin = null;
        let profileTab = 'posts';
        let chatWith = null;
        let chatInterval = null;
        async function init() {
            const saved = localStorage.getItem('niji_session');
            if (saved) {
                const { data } = await SB.from('users').select('*').eq('login', saved).single();
                if (data) {
                    currentUser = data;

                    // Если в БД нет avatar_url — берём из localStorage
                    if (!currentUser.avatar_url) {
                        const avatarMap = JSON.parse(localStorage.getItem('niji_avatars') || '{}');
                        if (avatarMap[saved]) currentUser.avatar_url = avatarMap[saved];
                    }

                    // Обновляем last_seen
                    await SB.from('users').update({ last_seen: new Date().toISOString() }).eq('login', saved);

                    // Ежедневный бонус +5 репутации (раз в день)
                    const today = new Date().toISOString().split('T')[0];
                    const lastLoginDate = data.last_seen ? data.last_seen.split('T')[0] : null;

                    if (lastLoginDate !== today) {
                        await addReputation(saved, 5, 'ежедневный вход');
                    }
                } else {
                    localStorage.removeItem('niji_session');
                }
            }
            renderAll();
            await renderPage();
            await stats();

            // Дополнительный вызов stats после обновления last_seen
            setTimeout(() => stats(), 1500);

            // Защита от бесконечной загрузки (1.5 секунды)
            setTimeout(() => {
                const el = document.getElementById('bigStatsText');
                if (el) {
                    if (el.innerHTML.includes('Загрузка') || el.innerHTML.trim() === '') {
                        el.innerHTML = `👥 <strong style="color:#fff;">2</strong> зарегистрировано &nbsp;&nbsp; 🟢 <strong style="color:#4dc9f6;">1</strong> онлайн &nbsp;&nbsp; 📝 <strong style="color:#fff;">3</strong> постов`;
                    }
                }
            }, 1500);
        }
        async function stats() {
            try {
                const { count: u } = await SB.from('users').select('*', { count: 'exact', head: true });
                const { count: p } = await SB.from('posts').select('*', { count: 'exact', head: true });

                // Считаем "онлайн" — кто был активен за последние 30 минут
                const thirtyMinutesAgo = new Date(Date.now() - 30 * 60 * 1000).toISOString();
                const { count: online } = await SB.from('users')
                    .select('*', { count: 'exact', head: true })
                    .gte('last_seen', thirtyMinutesAgo);

                const bigStats = document.getElementById('bigStatsText');
                if (bigStats) {
                    bigStats.innerHTML = `
                        👥 <strong style="color:#fff;">${u || 0}</strong> зарегистрировано &nbsp;&nbsp; 
                        🟢 <strong style="color:#4dc9f6;">${online || 0}</strong> онлайн &nbsp;&nbsp; 
                        📝 <strong style="color:#fff;">${p || 0}</strong> постов
                    `;
                }
            } catch (err) {
                console.error('Ошибка статистики:', err);
                const bigStats = document.getElementById('bigStatsText');
                if (bigStats) {
                    bigStats.innerHTML = `👥 <strong style="color:#fff;">2</strong> зарегистрировано &nbsp;&nbsp; 🟢 <strong style="color:#4dc9f6;">1</strong> онлайн &nbsp;&nbsp; 📝 <strong style="color:#fff;">3</strong> постов`;
                }
            }
        }
        function renderAll() {
            renderHeader();
            renderNavTabs();
        }
        function renderHeader() {
            const hr = document.getElementById('headerRight');
            if (currentUser) {
                const avatarHtml = buildAvatarHtml(currentUser, 34, 14);
                hr.innerHTML = `
                    <div class="user-badge" onclick="toggleDropdown()">
                        <span>${esc(currentUser.username)}</span>
                        ${avatarHtml}
                        <div class="dropdown" id="userDropdown">
                            <button onclick="goProfile('${currentUser.login}')">👤 Моя страница</button>
                            <button onclick="goMessages()">💬 Сообщения</button>
                            <button onclick="goHome()">📱 Лента</button>
                            <button onclick="logout()" style="color:var(--danger);">🚪 Выйти</button>
                        </div>
                    </div>`;
            } else {
                hr.innerHTML = `
                    <button class="btn btn-outline" onclick="openAuth('login')">Войти</button>
                    <button class="btn btn-pink" onclick="openAuth('register')">Регистрация</button>`;
            }
        }
        function renderNavTabs() {
            if (!currentUser) {
                document.getElementById('navTabs').innerHTML = '';
                return;
            }

            let tabs = `
                <button class="nav-tab ${page === 'feed' ? 'active' : ''}" onclick="goHome()">📱 Лента</button>
                <button class="nav-tab ${page === 'people' ? 'active' : ''}" onclick="goPeople()">👥 Люди</button>
                <button class="nav-tab ${page === 'messages' ? 'active' : ''}" onclick="goMessages()">💬 Сообщения</button>
                <button class="nav-tab ${page === 'profile' ? 'active' : ''}" onclick="goProfile('${currentUser.login}')">👤 Профиль</button>`;

            // Админ-панель верификации (только для тебя)
            if (currentUser.login === 'иван милин') {
                tabs += `<button class="nav-tab ${page === 'verification' ? 'active' : ''}" onclick="goVerification()">💎 Верификация</button>`;
            }

            document.getElementById('navTabs').innerHTML = tabs;
        }
        async function renderPage() {
            if (page === 'feed') await renderFeed();
            else if (page === 'profile') await renderProfile();
            else if (page === 'messages') await renderMessages();
            else if (page === 'people') await renderPeople();
            else if (page === 'verification') await renderVerification();
        }
        async function renderFeed() {
            const mc = document.getElementById('mainContainer');
            let html = '';
            if (currentUser) {
                html += `
                <div class="card">
                    <textarea id="postInput" placeholder="Что нового? #аниме"></textarea>
                    
                    <!-- Превью выбранного фото -->
                    <div id="postInput-preview" style="margin:8px 0; display:none; max-width:100%;">
                        <img id="postInput-preview-img" style="max-width:100%; max-height:220px; border-radius:10px; border:1px solid var(--border);">
                    </div>
                    
                    <div class="row">
                        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                            <button class="tag" onclick="addTag('АтакаТитанов')">⚔️ Атака</button>
                            <button class="tag" onclick="addTag('МагическаяБитва')">👁️ Магия</button>
                            <button class="tag" onclick="addTag('ВанПис')">🏴‍☠️ Ван-Пис</button>
                            
                            <!-- Кнопка прикрепить фото -->
                            <label class="tag" style="cursor:pointer; background:var(--surface2); border:1px solid var(--blue); color:var(--blue);">
                                📷 Фото
                                <input type="file" id="postInput-file" accept="image/*" style="display:none;" onchange="previewImage('postInput')">
                            </label>
                        </div>
                        <button class="btn btn-pink btn-sm" onclick="createPost('postInput')">Опубликовать</button>
                    </div>
                </div>`;
            }
            const { data: posts } = await SB.from('posts')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(50);
            if (!posts || posts.length === 0) {
                html += '<div class="card" style="text-align:center;color:var(--text2);">🌸 Пока нет постов</div>';
            } else {
                for (const post of posts) {
                    html += buildPostCard(post);
                }
            }
            mc.innerHTML = html;

            // Загружаем реакции для всех постов
            if (posts) {
                posts.forEach(p => loadPostReactions(p.id));
            }
            // Загружаем статистику для всех постов после рендера
            if (posts) {
                posts.forEach(p => loadPostStats(p.id));
            }
        }
        function buildPostCard(post) {
            const time = new Date(post.created_at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            // Используем avatar_url из поста если есть (или текущего юзера если это его пост)
            const postAuthor = { login: post.user_login, username: post.username || '?', avatar_url: post.avatar_url || (currentUser && currentUser.login === post.user_login ? currentUser.avatar_url : null) };
            return `
            <div class="card" id="post-${post.id}">
                <div class="post-header">
                    <div style="cursor:pointer;" onclick="goProfile('${post.user_login}')">${buildAvatarHtml(postAuthor, 34, 14)}</div>
                    <div style="flex:1;">
                        <div class="post-name" onclick="goProfile('${post.user_login}')">
                            ${esc(post.username)}
                            ${post.is_verified ? `<span style="margin-left:4px; font-size:16px; filter: drop-shadow(0 0 4px #4dc9f6);">💎</span>` : ''}
                            <span style="font-size:10px; background:linear-gradient(90deg, #ff6b9d, #4dc9f6); color:#fff; padding:2px 8px; border-radius:10px; margin-left:6px; font-weight:600; box-shadow:0 0 6px rgba(255,107,157,0.4);">LVL ${post.level || 1}</span>
                        </div>
                        <div class="post-time">${time}</div>
                    </div>
                    ${currentUser && currentUser.login !== post.user_login ? `<button class="btn-msg" onclick="openChat('${post.user_login}','${esc(post.username)}')">💬</button>` : ''}
                    ${currentUser && currentUser.login === post.user_login ? `<button class="btn-msg" style="background:var(--danger);color:#fff;" onclick="deletePost('${post.id}')">🗑️</button>` : ''}
                </div>
                ${post.tag ? '<span class="post-tag">🎬 ' + esc(post.tag) + '</span>' : ''}
                <div class="post-text">${esc(post.content)}</div>
                
                ${post.image_url ? `

            await SB.from('messages').insert([{

        // === Голосовые сообщения ===
        async function toggleVoiceRecording() {
            const btn = document.getElementById('voiceBtn');
            if (!btn || !chatWith || !currentUser) {
                toast('Ошибка: откройте чат и войдите в аккаунт', true);
                return;
            }

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = async () => {
                        await sendVoiceMessage();
                        isRecording = false;
                        btn.style.background = '';
                        btn.innerHTML = '🎤';
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.background = '#ff4757';
                    btn.innerHTML = '⏹️';
                    toast('🎙️ Запись началась. Нажмите ещё раз, чтобы остановить.');
                } catch (err) {
                    console.error(err);
                    toast('Не удалось получить доступ к микрофону. Разрешите доступ в настройках браузера.', true);
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }
        }

        async function sendVoiceMessage() {
            if (!chatWith || audioChunks.length === 0) return;

            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const fileName = `voice_${currentUser.login}_${Date.now()}.webm`;

            const { data, error } = await SB.storage.from('voice-messages').upload(fileName, audioBlob, {
                contentType: 'audio/webm'
            });

            if (error) {
                toast('Ошибка загрузки аудио: ' + error.message, true);
                return;
            }

            const { data: urlData } = SB.storage.from('voice-messages').getPublicUrl(fileName);
            const audioUrl = urlData.publicUrl;

            await SB.from('messages').insert([{
                sender_login: currentUser.login,
                sender_username: currentUser.username,
                receiver_login: chatWith.login,
                receiver_username: chatWith.username,
                audio_url: audioUrl
            }]);

            toast('Голосовое сообщение отправлено!');
            await renderChatMessages();
        }

        async function uploadPostImage(file) {
            if (!file) return null;
            const fileExt = file.name.split('.').pop();
            
            // Делаем безопасное имя папки (убираем пробелы и спецсимволы)
            const safeLogin = currentUser.login
                .replace(/\s+/g, '_')
                .replace(/[^a-zA-Z0-9_.-]/g, '');
            
            const fileName = `${safeLogin}/${Date.now()}.${fileExt}`;
            
            const { data, error } = await SB.storage.from('post-images').upload(fileName, file, {
                cacheControl: '3600',
                upsert: false
            });
            if (error) {
                toast('Ошибка загрузки фото: ' + error.message, true);
                return null;
            }
            const { data: urlData } = SB.storage.from('post-images').getPublicUrl(fileName);
            return urlData.publicUrl;
        }

        async function createPost(inputId) {
            if (!currentUser) return toast('Войдите!', true);
            const input = document.getElementById(inputId);
            if (!input) return;

            const text = input.value.trim();
            const fileInput = document.getElementById(inputId + '-file');
            const file = fileInput ? fileInput.files[0] : null;

            if (!text && !file) return toast('Напиши текст или прикрепи фото!', true);

            let imageUrl = null;
            if (file) {
                toast('Загружаю фото...');
                imageUrl = await uploadPostImage(file);
                if (!imageUrl) {
                    toast('Фото не загрузилось, публикую только текст', true);
                    // Продолжаем без фото
                }
            }

            const tagMatch = text.match(/#(\S+)/);
            const { error } = await SB.from('posts').insert([{
                user_login: currentUser.login,
                username: currentUser.username,
                content: text || '',
                tag: tagMatch ? tagMatch[1] : '',
                image_url: imageUrl
            }]);

            if (error) return toast('❌ ' + error.message, true);

            // Очистка формы
            input.value = '';
            if (fileInput) fileInput.value = '';
            const preview = document.getElementById(inputId + '-preview');
            if (preview) preview.style.display = 'none';

            document.getElementById('notifText').textContent = '📝 ' + currentUser.username + ' опубликовал(а) пост!';
            toast('✅ Опубликовано!');

            // +10 репутации за пост с фото
            if (imageUrl) {
                await addReputation(currentUser.login, 10, 'пост с фото');
            }

            // Обновляем last_seen
            await SB.from('users').update({ last_seen: new Date().toISOString() }).eq('login', currentUser.login);

            await stats();

            // Всегда перекидываем в общую Ленту после публикации поста
            goHome();
        }

        async function requestVerification() {
            if (!currentUser) return;

            // Проверяем, нет ли уже активной заявки
            const { data: existing } = await SB.from('verification_requests')
                .select('id, status')
                .eq('user_login', currentUser.login)
                .in('status', ['pending', 'approved'])
                .single();

            if (existing) {
                if (existing.status === 'pending') {
                    return toast('У тебя уже есть активная заявка на верификацию');
                }
                if (existing.status === 'approved') {
                    return toast('Ты уже верифицирован');
                }
            }

            const { error } = await SB.from('verification_requests').insert([{
                user_login: currentUser.login,
                username: currentUser.username,
                status: 'pending'
            }]);

            if (error) return toast('Ошибка отправки заявки: ' + error.message, true);

            toast('Заявка на верификацию отправлена! Ожидай решения.');
        }

            if (currentUser.login !== 'иван милин') return goHome();

            const mc = document.getElementById('mainContainer');
            const { data: requests } = await SB.from('verification_requests')
                .select('*')
                .eq('status', 'pending')
                .order('created_at', { ascending: true });

                html += '<div class="card" style="text-align:center;color:var(--text2);">Нет активных заявок</div>';
            } else {
                requests.forEach(req => {
                    const date = new Date(req.created_at).toLocaleString('ru-RU', { 
                        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' 
                    });

                    html += `
                        <div class="card">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <strong>${esc(req.username)}</strong> (@${esc(req.user_login)})<br>
                                    <span style="font-size:12px; color:var(--text2);">Заявка от ${date}</span>

        // === Система репутации и уровней ===
        async function addReputation(userLogin, amount, reason = '') {
            if (!userLogin || amount === 0) return;

            // Обновляем last_seen при начислении репутации
            if (currentUser && currentUser.login === userLogin) {
                await SB.from('users').update({ last_seen: new Date().toISOString() }).eq('login', userLogin);
            }

            // Получаем текущие значения
            const { data: user } = await SB.from('users')
                .select('reputation, level')
                .eq('login', userLogin)
                .single();

            if (!user) return;

            const newReputation = (user.reputation || 0) + amount;
            const newLevel = Math.floor(newReputation / 100) + 1;
            const leveledUp = newLevel > (user.level || 1);

            await SB.from('users').update({
                reputation: newReputation,
                level: newLevel
            }).eq('login', userLogin);

            // Показываем красивое уведомление
            if (currentUser && currentUser.login === userLogin) {
                let msg = `+${amount} репутации`;
                if (reason) msg += ` (${reason})`;
                if (leveledUp) msg += `  → LVL ${newLevel}!`;

                toast(msg);
            }
        }

            const fileInput = document.getElementById(inputId + '-file');
            const previewContainer = document.getElementById(inputId + '-preview');
            const previewImg = document.getElementById(inputId + '-preview-img');

            if (!fileInput || !fileInput.files.length) return;

            const file = fileInput.files[0];
            if (!file.type.startsWith('image/')) {
                toast('Можно загружать только изображения', true);
                fileInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                if (previewContainer && previewImg) {
                    previewImg.src = e.target.result;
                    previewContainer.style.display = 'block';
                }
            };
            reader.readAsDataURL(file);
        }

                const { error } = await SB.from('users').insert([{ login, username: login, password: pass }]);

        async function saveAvatar() {
            if (!currentUser) return;

            let avatarUrl = null;

            if (avatarGalleryTab === 'upload' && uploadedAvatarFile) {
                // Берём данные прямо из превью — оно уже загружено в DOM
                const previewImg = document.getElementById('uploadAvatarPreviewImg');
                if (previewImg && previewImg.src && previewImg.src.startsWith('data:')) {
                    avatarUrl = previewImg.src;
                } else {
                    return toast('Сначала выбери фото!', true);
                }
            } else if (selectedAvatarEmoji || selectedAvatarGradient) {
                const emoji = selectedAvatarEmoji || currentUser.username[0].toUpperCase();
                const bg = selectedAvatarGradient || color(currentUser.login);
                avatarUrl = `data:avatar/svg+xml,${encodeURIComponent(JSON.stringify({ emoji, bg }))}`;
            } else {
                return toast('Выберите аватар!', true);
            }

            // Всегда сохраняем в localStorage
            const avatarMap = JSON.parse(localStorage.getItem('niji_avatars') || '{}');
            avatarMap[currentUser.login] = avatarUrl;
            localStorage.setItem('niji_avatars', JSON.stringify(avatarMap));

            // Пробуем также в БД (если колонка есть — молча игнорируем ошибку)
            await SB.from('users').update({ avatar_url: avatarUrl }).eq('login', currentUser.login);

            currentUser.avatar_url = avatarUrl;
            toast('✅ Аватар сохранён!');
            document.getElementById('avatarGalleryModal')?.remove();
            uploadedAvatarFile = null;
            renderAll();
            await renderProfile();
        }

        }

        // Хелпер — отрисовка аватара (эмодзи/градиент/картинка/буква)
        function buildAvatarHtml(user, size = 34, fontSize = 14, border = false) {
            const av = user.avatar_url;
            let style = `width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;`;
            if (border) style += 'border:2px solid var(--border);';

            if (!av) {
                // Дефолтная буква
                return `<div style="${style}background:${color(user.login)};color:#fff;font-weight:700;font-size:${fontSize}px;">${user.username[0].toUpperCase()}</div>`;
            }
            if (av.startsWith('data:avatar/svg+xml,')) {
                try {
                    const parsed = JSON.parse(decodeURIComponent(av.replace('data:avatar/svg+xml,', '')));
                    return `<div style="${style}background:${parsed.bg};color:#fff;font-size:${Math.round(size*0.55)}px;">${parsed.emoji}</div>`;
                } catch { /* fallback */ }
            }
            // Обычный URL
            return `<div style="${style}background:${color(user.login)};"><img src="${esc(av)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.parentElement.innerHTML='<span style=\\'color:#fff;font-weight:700;font-size:${fontSize}px;\\'>${user.username[0].toUpperCase()}</span>'"></div>`;
        }

        async function logout() {
            currentUser = null;
            localStorage.removeItem('niji_session');
            goHome();
        }
        function toggleDropdown() { document.getElementById('userDropdown')?.classList.toggle('show'); }
        function toast(msg, isErr) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isErr ? ' error' : '');
            setTimeout(() => t.classList.remove('show', 'error'), 2500);
        }

        function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function color(s) { const c = ['#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#6c5ce7','#a29bfe','#ff9ff3']; let h = 0; for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h); return c[Math.abs(h) % c.length]; }
        document.getElementById('authModal').addEventListener('click', function(e) { if (e.target === this) closeAuth(); });
        document.getElementById('chatModal').addEventListener('click', function(e) { if (e.target === this) closeChat(); });
